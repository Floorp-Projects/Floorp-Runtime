        proof={'contract':'fresh45-native-input-probe-20261029-v1','status':'failed',
            'repository':os.environ['GITHUB_REPOSITORY'],'ref':os.environ['GITHUB_REF'],
            'head':os.environ['GITHUB_SHA'],'run':int(os.environ['GITHUB_RUN_ID']),'attempt':1,
            'fixture':os.environ['FLOORP_FIXTURE_SHA'],'qualification':None,
            'freshFirefox45Executed':False,'productQualification':False}
        phase='platform'
        def need(value):
            if not value:raise RuntimeError(phase)
        def digest(path):
            with path.open('rb') as stream:return hashlib.file_digest(stream,'sha256').hexdigest()
        try:
            need(sys.platform=='darwin' and platform.machine()=='x86_64' and sys.version_info[:3]==(3,12,10))
            proof.update(pythonVersion=platform.python_version(),machine=platform.machine(),
                macOSVersion=platform.mac_ver()[0],imageOS=os.environ.get('ImageOS'),imageVersion=os.environ.get('ImageVersion'))
            phase='source-pins'
            helper=(pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'fixture/tools/qa/native-nonpgo').resolve()
            pins=json.loads(os.environ['QA_SOURCE_PINS'])
            actual={str(p.relative_to(helper)):digest(p) for p in helper.rglob('*')
                if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc'}
            need(pins==actual and len(pins)==148 and not any(p.is_symlink() for p in helper.rglob('*')))
            proof['sourcePins']=len(pins)
            phase='openssl-installation'
            selected=pathlib.Path('/usr/local/opt/openssl@3/bin/openssl')
            binary=selected.resolve(strict=True)
            relative=binary.relative_to('/usr/local/Cellar/openssl@3')
            need(len(relative.parts)==3 and relative.parts[1:]==('bin','openssl') and relative.parts[0].startswith('3.'))
            prefix=binary.parent.parent
            receipt=prefix/'INSTALL_RECEIPT.json'
            need(receipt.is_file() and not receipt.is_symlink() and 0<receipt.stat().st_size<=512*1024)
            proof['openssl']={'selection':str(selected),'resolved':str(binary),'cellarVersion':relative.parts[0],
                'binarySHA256':digest(binary),'installationReceiptSHA256':digest(receipt),
                'libraries':{name:digest(prefix/'lib'/name) for name in ('libcrypto.3.dylib','libssl.3.dylib')}}
            phase='openssl-version'
            result=subprocess.run([str(selected),'version'],capture_output=True,timeout=10,
                env={'PATH':'/usr/bin:/bin','LANG':'C','OPENSSL_CONF':'/dev/null'})
            need(result.returncode==0 and len(result.stdout)<1024)
            version=result.stdout.decode('ascii').strip()
            need(re.fullmatch(r'OpenSSL 3\.[0-9]+\.[0-9]+[a-z]?(?:[ -].*)?',version) is not None)
            proof['openssl']['version']=version
            phase='transport-controls'
            temporary=root/'temporary'
            temporary.mkdir(mode=0o700)
            environment={'PATH':'/usr/bin:/bin:/usr/sbin:/sbin','HOME':str(root),'LANG':'C.UTF-8',
                'TMPDIR':str(temporary),'PYTHONPATH':str(helper),'PYTHONDONTWRITEBYTECODE':'1'}
            started=time.monotonic()
            with (root/'transport.private.log').open('wb') as log:
                controls=subprocess.run([sys.executable,'-m','unittest','-v','test_diagnostic_archive'],
                    cwd=helper,env=environment,stdout=log,stderr=subprocess.STDOUT,timeout=180)
            sys.path.insert(0,str(helper))
            from unittest_receipt import receipt as read_receipt
            summary=read_receipt(root/'transport.private.log')
            proof['transportControls']=summary
            proof['controlsElapsedSeconds']=round(time.monotonic()-started,3)
            need(controls.returncode==0 and summary['complete'] is True and summary['status']=='passed'
                and summary['total']==13 and all(summary[k]==0 for k in ('failures','errors','skipped')))
            phase='temporary-cleanup'
            need(not any(temporary.iterdir()))
            temporary.rmdir()
            proof.update(status='passed',temporaryCleanupClean=True)
        except Exception:
            proof['failurePhase']=phase
        finally:
            raw=(json.dumps(proof,sort_keys=True)+'\n').encode()
            target=root/'proof.json'
            with target.open('xb') as output:output.write(raw)
            target.chmod(0o600)
            print(raw.decode().strip(),flush=True)
        raise SystemExit(0 if proof['status']=='passed' else 1)
        PROBE
    - name: Retain only the public dependency proof even after probe failure
      if: always()
      timeout-minutes: 2
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-input-proof-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/floorp-native-input-probe-${{ github.run_id }}-${{ github.run_attempt }}/proof.json
        retention-days: 14
        if-no-files-found: error
        overwrite: false
        include-hidden-files: false
  download-macos-sdk:
    needs: input-provenance
    if: ${{ always() && github.repository == 'Floorp-Projects/Floorp-Runtime' && github.ref == 'refs/heads/b/qa-handoff-20261026'
      && github.run_attempt == 1 && github.event.created == false && github.event.before == '11f66dbfa00471e3c6a13993888c4c85cb1ccaf8'
      }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
    - name: Require the one recorded handoff push and initial attempt
      timeout-minutes: 1
      env:
        PUSH_CREATED: ${{ github.event.created }}
        PUSH_BEFORE: ${{ github.event.before }}
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Floorp-Projects/Floorp-Runtime
        test "$GITHUB_REF" = refs/heads/b/qa-handoff-20261026
        test "$GITHUB_EVENT_NAME" = push
        test "$GITHUB_RUN_ATTEMPT" = 1
        test "$PUSH_CREATED" = false
        test "$PUSH_BEFORE" = 11f66dbfa00471e3c6a13993888c4c85cb1ccaf8
    - name: Select the original Xcode 26.6 build 17F113 SDK
      shell: bash
      run: |
        set -euo pipefail
        xcode=/Applications/Xcode_26.6.app
        test -d "$xcode"
        test ! -L "$xcode"
        developer="$xcode/Contents/Developer"
        xcode_version=$(DEVELOPER_DIR="$developer" xcodebuild -version)
        test "$xcode_version" = $'Xcode 26.6\nBuild version 17F113'
        version=$(DEVELOPER_DIR="$developer" xcrun --sdk macosx --show-sdk-version)
        test "$version" = 26.5
        SDK_PATH=$(DEVELOPER_DIR="$developer" xcrun --sdk macosx --show-sdk-path)
        test "$SDK_PATH" = "$developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX26.5.sdk"
        test -d "$SDK_PATH"
        printf '{"xcodeVersion":"26.6","xcodeBuild":"17F113","sdkVersion":"26.5"}\n'
        echo "SDK_PATH=$SDK_PATH" >> "$GITHUB_ENV"
    - name: Require the original complete uncompressed tar identity
      shell: bash
      run: |
        set -euo pipefail
        tar -czf macos_sdk.tar.gz -C "$SDK_PATH" .
        checksum=$(gzip -dc macos_sdk.tar.gz | shasum -a 256 | cut -d ' ' -f 1)
        bytes=$(gzip -dc macos_sdk.tar.gz | wc -c | tr -d '[:space:]')
        printf '{"uncompressedTarSHA256":"%s","uncompressedTarBytes":%s}\n' "$checksum" "$bytes"
        test "$checksum" = 57aeb200890ba97c382bf450f23f9dab3e0d4696fdf02323a705f82210b087e3
        test "$bytes" = 760518144
    - name: Retain the content-matched SDK for the next roadmap native input freeze
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: macos-sdk
        path: macos_sdk.tar.gz
        retention-days: 7
        if-no-files-found: error
        overwrite: false
        include-hidden-files: false
