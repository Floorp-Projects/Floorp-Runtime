#TODO: separate Publish to other workflow

on:
  workflow_call:
    inputs:
      x86_64_artifact_name:
        type: string
        default: ""
      aarch64_artifact_name:
        type: string
        default: ""
      beta:
        type: boolean
        default: false
      MOZ_BUILD_DATE:
        description: "Resolved 14-digit build ID"
        type: string
        required: true
      debug:
        type: boolean
        default: false
    outputs:
      artifact-name:
        description: "Final universal macOS artifact name"
        value: ${{ jobs.Integration.outputs.artifact-name }}
      artifact-id:
        description: "Final universal macOS artifact ID"
        value: ${{ jobs.Integration.outputs.artifact-id }}
      artifact-digest:
        description: "Final universal macOS artifact digest"
        value: ${{ jobs.Integration.outputs.artifact-digest }}
      expected-build-id:
        description: "Expected build ID embedded in the artifact"
        value: ${{ jobs.Integration.outputs.expected-build-id }}

permissions:
  actions: read
  contents: read

jobs:
  Integration:
    runs-on: macos-26
    outputs:
      artifact-name: floorp-mac-universal-moz-artifact
      artifact-id: ${{ steps.upload-primary.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-primary.outputs.artifact-digest }}
      expected-build-id: ${{ inputs.MOZ_BUILD_DATE }}
    steps:
      - name: Init
        run: |
          export RUNNER_USERDIR=`echo ~`
          echo "RUNNER_USERDIR=$RUNNER_USERDIR" >> $GITHUB_ENV

      - name: Free up disk space 🧹
        run: |
          echo "=== Disk space before cleanup ==="
          df -h

          # Remove unnecessary large directories to free up disk space
          # These are pre-installed tools that are not needed for the Integration job

          # Remove old Xcode versions (~10-15 GB each, keeping only latest)
          for xcode in /Applications/Xcode_14*.app /Applications/Xcode_15.{0,1,2,3}*.app; do
            [ -e "$xcode" ] && sudo rm -rf "$xcode"
          done

          # Remove Android SDK (~10-15 GB)
          sudo rm -rf /Users/runner/Library/Android || true
          sudo rm -rf /usr/local/lib/android || true

          # Remove PowerShell (~1 GB)
          sudo rm -rf /usr/local/share/powershell || true

          # Remove GHCup/Haskell toolchain (~5 GB)
          sudo rm -rf /usr/local/.ghcup || true

          # Remove iOS Simulator files (~10-20 GB)
          sudo rm -rf /Library/Developer/CoreSimulator || true

          echo "=== Disk space after cleanup ==="
          df -h

      - name: Clone 📥
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: download AArch64 build artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.aarch64_artifact_name }}
          path: ./downloaded-artifacts/aarch64

      - name: download x86_64 build artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.x86_64_artifact_name }}
          path: ./downloaded-artifacts/x86_64

      - name: Download macOS SDK
        uses: actions/download-artifact@v4
        with:
          name: macos-sdk
          path: ~/macos-sdk-artifact

      - name: Extract macOS SDK
        run: |
          mkdir -p ~/macos-sdk
          gtar -xzf ~/macos-sdk-artifact/macos_sdk.tar.gz -C ~/macos-sdk --warning=no-unknown-keyword || tar -xzf ~/macos-sdk-artifact/macos_sdk.tar.gz -C ~/macos-sdk
          rm -rf ~/macos-sdk-artifact

      - name: Extract 📦
        run: |
          set -euo pipefail
          X86_64_ARCHIVE=./downloaded-artifacts/x86_64/floorp-mac-x86_64-moz-artifact.tar.gz
          AARCH64_ARCHIVE=./downloaded-artifacts/aarch64/floorp-mac-aarch64-moz-artifact.tar.gz

          if [[ ! -f "$X86_64_ARCHIVE" || ! -f "$AARCH64_ARCHIVE" ]]; then
            echo "Missing one or both architecture package archives" >&2
            find ./downloaded-artifacts -maxdepth 3 -type f -print >&2
            exit 1
          fi

          mkdir -p ./obj-x86_64-apple-darwin/dist
          tar -xf "$X86_64_ARCHIVE" -C ./obj-x86_64-apple-darwin/dist
          mkdir -p ./obj-aarch64-apple-darwin/dist
          tar -xf "$AARCH64_ARCHIVE" -C ./obj-aarch64-apple-darwin/dist

      - name: Check Branding Type
        shell: bash
        run: |
          if [[ $GHA_BETA == 'true' ]]; then
            export APP_NAME=`echo "Floorp Daylight"`
            echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          else
            export APP_NAME=`echo "Floorp"`
            echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          fi
        env:
          GHA_BETA: ${{ inputs.beta }}

      - name: force install python3.12
        continue-on-error: true
        run: |
          brew install python@3.12

      - name: force link python3.12
        continue-on-error: true
        run: |
          # due to "Error: The `brew link` step did not complete successfully" we need to force link python3.12
          brew link --force --overwrite python@3.12

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: setup environment 🌲
        continue-on-error: true
        env:
          SDKROOT: ${{ env.RUNNER_USERDIR }}/macos-sdk
          MACOS_SDK_DIR: ${{ env.RUNNER_USERDIR }}/macos-sdk
          MOZ_SDK_DIR: ${{ env.RUNNER_USERDIR }}/macos-sdk
          MOZ_BUILD_DATE: ${{ inputs.MOZ_BUILD_DATE }}
        run: |
          echo "ac_add_options --disable-bootstrap" >> mozconfig

          # Add macOS SDK path
          echo "ac_add_options --with-macos-sdk=$(echo ~)/macos-sdk" >> mozconfig

          echo 'mozconfig: **********************'
          cat ./mozconfig
          echo '*********************************'

          brew install gnu-tar
          export PATH=/usr/local/opt/gnu-tar/libexec/gnubin:$PATH
          ./mach --no-interactive bootstrap --application-choice browser

          # Override mozconfig
          echo -e "ac_add_options --enable-bootstrap" > mozconfig
          echo "ac_add_options --with-macos-sdk=$(echo ~)/macos-sdk" >> mozconfig

      - name: Extract .app from dmg 📦
        run: |
          rm -rf "./obj-x86_64-apple-darwin/dist/floorp/*.app"
          rm -rf "./obj-aarch64-apple-darwin/dist/floorp/*.app"

          ls ./obj-x86_64-apple-darwin/dist/

          # Mount x86_64 DMG
          x86_64_dmg=$(ls ./obj-x86_64-apple-darwin/dist/floorp*.mac.dmg | head -n 1)
          hdiutil attach "$x86_64_dmg"

          # Find the actual volume name (it may vary)
          VOLUME_NAME=$(ls /Volumes/ | grep -i floorp | head -n 1)
          echo "Found volume: $VOLUME_NAME"

          # Resolve the .app directory within the mounted volume
          declare -a CANDIDATE_APPS
          if [[ "$GHA_DEBUG" == "true" ]]; then
            CANDIDATE_APPS=("${APP_NAME} Debug.app" "${APP_NAME}Debug.app" "Floorp Daylight Debug.app" "Floorp DaylightDebug.app" "Floorp Debug.app" "FloorpDebug.app")
          else
            CANDIDATE_APPS=("${APP_NAME}.app" "Floorp Daylight.app" "Floorp.app")
          fi

          APP_SOURCE=""
          for candidate in "${CANDIDATE_APPS[@]}"; do
            if [[ -d "/Volumes/${VOLUME_NAME}/${candidate}" ]]; then
              APP_SOURCE="/Volumes/${VOLUME_NAME}/${candidate}"
              echo "Matched app candidate: ${candidate}"
              break
            fi
          done

          if [[ -z "$APP_SOURCE" ]]; then
            APP_SOURCE=$(find "/Volumes/${VOLUME_NAME}" -maxdepth 1 -type d -name "*.app" | head -n 1)
          fi

          if [[ -z "$APP_SOURCE" || ! -d "$APP_SOURCE" ]]; then
            echo "Unable to locate the .app bundle in /Volumes/${VOLUME_NAME}" >&2
            exit 1
          fi

          cp -r "$APP_SOURCE" ./obj-x86_64-apple-darwin/dist/floorp/
          hdiutil detach "/Volumes/${VOLUME_NAME}/"
          rm "$x86_64_dmg"

          # Mount aarch64 DMG
          aarch64_dmg=$(ls ./obj-aarch64-apple-darwin/dist/floorp*.mac.dmg | head -n 1)
          hdiutil attach "$aarch64_dmg"

          # Find the actual volume name (it may vary)
          VOLUME_NAME=$(ls /Volumes/ | grep -i floorp | head -n 1)
          echo "Found volume: $VOLUME_NAME"

          APP_SOURCE=""
          for candidate in "${CANDIDATE_APPS[@]}"; do
            if [[ -d "/Volumes/${VOLUME_NAME}/${candidate}" ]]; then
              APP_SOURCE="/Volumes/${VOLUME_NAME}/${candidate}"
              echo "Matched app candidate: ${candidate}"
              break
            fi
          done

          if [[ -z "$APP_SOURCE" ]]; then
            APP_SOURCE=$(find "/Volumes/${VOLUME_NAME}" -maxdepth 1 -type d -name "*.app" | head -n 1)
          fi

          if [[ -z "$APP_SOURCE" || ! -d "$APP_SOURCE" ]]; then
            echo "Unable to locate the .app bundle in /Volumes/${VOLUME_NAME}" >&2
            exit 1
          fi

          cp -r "$APP_SOURCE" ./obj-aarch64-apple-darwin/dist/floorp/
          hdiutil detach "/Volumes/${VOLUME_NAME}/"
          rm "$aarch64_dmg"
        env:
          GHA_DEBUG: ${{ inputs.debug }}

      - name: Integration 🗃
        env:
          SDKROOT: ${{ env.RUNNER_USERDIR }}/macos-sdk
          MACOS_SDK_DIR: ${{ env.RUNNER_USERDIR }}/macos-sdk
          MOZ_SDK_DIR: ${{ env.RUNNER_USERDIR }}/macos-sdk
          MOZ_BUILD_DATE: ${{ inputs.MOZ_BUILD_DATE }}
        run: |
          ./mach python "./toolkit/mozapps/installer/unify.py" ./obj-x86_64-apple-darwin/dist/floorp/*.app ./obj-aarch64-apple-darwin/dist/floorp/*.app
      - name: Create DMG 📦
        env:
          SDKROOT: ${{ env.RUNNER_USERDIR }}/macos-sdk
          MACOS_SDK_DIR: ${{ env.RUNNER_USERDIR }}/macos-sdk
          MOZ_SDK_DIR: ${{ env.RUNNER_USERDIR }}/macos-sdk
          MOZ_BUILD_DATE: ${{ inputs.MOZ_BUILD_DATE }}
          GHA_DEBUG: ${{ inputs.debug }}
        run: |
          set -euo pipefail
          UNIVERSAL_APP=$(find ./obj-x86_64-apple-darwin/dist/floorp -maxdepth 1 -name "*.app" -type d)
          ./mach python .github/workflows/scripts/repack_mac_debug_runtime.py \
            --app "$UNIVERSAL_APP" \
            --expected-build-id "$MOZ_BUILD_DATE" \
            --evidence ./runtime-packaging-provenance.json
          ./mach python -m mozbuild.action.make_dmg ./obj-x86_64-apple-darwin/dist/floorp floorp-macOS-universal-moz-artifact.dmg

          cp ./obj-x86_64-apple-darwin/dist/floorp*update_framework_artifacts.zip ./floorp-macOS.update_framework_artifacts.zip

          # Find the correct .app directory (handles both Floorp.app and FloorpDebug.app)
          APP_DIR=$(find ./obj-x86_64-apple-darwin/dist/floorp -maxdepth 1 -name "*.app" -type d | head -n 1)
          cp "${APP_DIR}/Contents/Resources/application.ini" ./floorp-application.ini

      - name: Stage consolidated universal artifact
        env:
          EXPECTED_BUILD_ID: ${{ inputs.MOZ_BUILD_DATE }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_BUILD_ID" =~ ^[0-9]{14}$ ]]; then
            echo "Expected build ID must be exactly 14 digits: $EXPECTED_BUILD_ID" >&2
            exit 1
          fi

          ACTUAL_BUILD_ID=$(awk -F= '$1 == "BuildID" { print $2; exit }' ./floorp-application.ini | tr -d '\r')
          if [[ "$ACTUAL_BUILD_ID" != "$EXPECTED_BUILD_ID" ]]; then
            echo "Universal application.ini BuildID $ACTUAL_BUILD_ID does not match $EXPECTED_BUILD_ID" >&2
            exit 1
          fi

          STAGE_DIR=./artifact-stage/floorp-mac-universal-moz-artifact
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/dist-host"

          cp ./floorp-macOS-universal-moz-artifact.dmg "$STAGE_DIR/"
          cp ./floorp-macOS.update_framework_artifacts.zip "$STAGE_DIR/"
          cp -a ./obj-x86_64-apple-darwin/dist/host/. "$STAGE_DIR/dist-host/"
          cp ./floorp-application.ini "$STAGE_DIR/floorp-application.ini"
          if [[ -f ./runtime-packaging-provenance.json ]]; then
            cp ./runtime-packaging-provenance.json "$STAGE_DIR/"
          fi

          test -s "$STAGE_DIR/floorp-macOS-universal-moz-artifact.dmg"
          test -s "$STAGE_DIR/floorp-macOS.update_framework_artifacts.zip"
          test -s "$STAGE_DIR/floorp-application.ini"
          HOST_ENTRY=$(find "$STAGE_DIR/dist-host" -type f -print | sed -n '1p')
          if [[ -z "$HOST_ENTRY" ]]; then
            echo "The consolidated artifact has an empty dist-host directory" >&2
            exit 1
          fi

      - name: Publish Package Mozilla Artifact 🎁
        id: upload-primary
        uses: actions/upload-artifact@v4
        with:
          name: floorp-mac-universal-moz-artifact
          path: ./artifact-stage/floorp-mac-universal-moz-artifact/
          if-no-files-found: error
          overwrite: true

      - name: Publish dist/host for MAR
        uses: actions/upload-artifact@v4
        with:
          name: macOS-universal-dist-host
          path: obj-x86_64-apple-darwin/dist/host/
          if-no-files-found: error
          overwrite: true

      - name: Publish floorp-application.ini for MAR
        uses: actions/upload-artifact@v4
        with:
          name: macOS-universal-application-ini
          path: ./floorp-application.ini
          if-no-files-found: error
          overwrite: true


