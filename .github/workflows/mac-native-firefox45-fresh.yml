                    upstreamProofVerified=False,targetProofVerified=False,postEmitStateVerified=False)
                if evidence.get('finalizationFailureCode') is None:evidence['finalizationFailureCode']=code

            def remember(view):
                nonlocal primary,monitor
                if type(view) is not dict:return
                if view.get('firstFailure') is not None:
                    if primary is None:
                        primary=failure_safe(view['firstFailure'])
                        evidence.update(firstFailure=primary,firstFailureAvailable=True,firstFailureSource='post-emit-summary')
                    reject('summary-first-failure')
                if view.get('monitorFailure') is not None:
