name: Prioritized restored Firefox targets and current Mozilla smoke
'on':
  push:
    branches:
    - codex/mac-native-mozilla-target-recovery57-20261019
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-intel-checkpoint-${{ github.ref }}
  cancel-in-progress: false
env:
  FLOORP_FIXTURE_SHA: 4e6d275a52619cdb06e4a0995d914d2931c0eb6d
  HARNESS_SHA: cbe45a7d7480d713b2c40a9ed348420126e6ccb0
  RUNTIME_SHA: 7dd619742b25567e479eeda97ae071d10542ad0b
  SDK_SOURCE_SHA256: ef5d0ed40f4f27b919df7a46323c63b7790ba325ce288a873b207858614bd688
  TARGET_HELPER_SHA256: b9a5debecd559aed8550e3a5e5a102fdbb3646cb57e5cef94f2bf8e2e0658eb3
  PIPELINE_SHA256: e0f750a8905ee49f32ed0cb4f5b78b3b56e6c3ac122ce85e780856db06368eb5
jobs:
  consumer:
    name: checkpoint-consumer
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
    - name: Bound the initial authorized execution
      timeout-minutes: 1
      shell: bash
      run: 'set -euo pipefail

        test "$GITHUB_REPOSITORY" = Floorp-Projects/Floorp-Runtime

        [[ "$FLOORP_FIXTURE_SHA" =~ ^[0-9a-f]{40}$ ]]

        [[ "$SDK_SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]

        test "$GITHUB_REF" = refs/heads/codex/mac-native-mozilla-target-recovery57-20261019

        test "$GITHUB_EVENT_NAME" = push

        test "$GITHUB_RUN_ATTEMPT" = 1

        test ''${{ github.event.created }}'' = true

        test ''${{ github.event.before }}'' = 0000000000000000000000000000000000000000

        TASK_PYTHON="$RUNNER_TOOL_CACHE/Python/3.12.10/x64/bin/python3"

        test -x "$TASK_PYTHON"

        echo "TASK_PYTHON=$TASK_PYTHON" >> "$GITHUB_ENV"

        echo "TASK_ROOT=$RUNNER_TEMP/floorp-native-checkpoint" >> "$GITHUB_ENV"

        [[ "$TARGET_HELPER_SHA256" =~ ^[0-9a-f]{64}$ ]]

        [[ "$PIPELINE_SHA256" =~ ^[0-9a-f]{64}$ ]]

        '
    - name: Checkout immutable reviewed fixture
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: Floorp-Projects/Floorp
        ref: ${{ env.FLOORP_FIXTURE_SHA }}
        path: fixture
        persist-credentials: false
        fetch-depth: 1
    - name: Establish this job's fresh clock and task root
      timeout-minutes: 3
      env:
        CHECKPOINT_READ_TOKEN: ${{ github.token }}
      shell: bash
      run: '"$TASK_PYTHON" fixture/tools/qa/native-nonpgo/checkpoint_transfer.py init --role consumer --task "$TASK_ROOT"

        '
    - name: Verify actual native process monitor before acquisition
      timeout-minutes: 10
      shell: bash
      run: "\"$TASK_PYTHON\" - > \"$TASK_ROOT/monitor-preflight-driver.private.log\" 2>&1 <<'PYCODE'\nimport json,os,pathlib,re,sys\n\
        helper=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'fixture/tools/qa/native-nonpgo'\nsys.path.insert(0,str(helper))\n\
        from support import Runner,clean_environment,require,write_json\nfrom darwin_activity import probe\nfrom\
        \ unittest_receipt import receipt as unittest_receipt\nfrom process_census import BINDING_KEYS,prepare_abi,load_abi,snapshot\n\
        task=pathlib.Path(os.environ['TASK_ROOT'])\nplan=json.loads((helper/'plan.json').read_text())\nrunner=Runner(task,float((task/'started').read_text()),plan['limits'])\n\
        env=clean_environment(task)\ntemporary=task/'monitor-tmp'\ntemporary.mkdir(mode=0o700)\nenv['TMPDIR']=str(temporary)\n\
        env['PYTHONDONTWRITEBYTECODE']='1'\nenv['PYTHONWARNINGS']='error::ResourceWarning'\nenv['PATH']+=':/usr/local/bin'\n\
        result={'status':'failed'}\nprimary_error=None\nphase='self-probe'\ntry:\n    own=probe().read(os.getpid(),os.getpgrp())\n\
        \    require(own['status']=='measured' and own['rssMiB']>0,'monitor-native-self-unavailable')\n    result['self']={key:own[key]\
        \ for key in ('status','rssMiB','cpuSeconds','state')}\n    phase='abi'\n    abi=prepare_abi(task,runner,env)\n\
        \    os.environ['FLOORP_CENSUS_ABI']=str(abi)\n    env.update({key:os.environ[key] for key in (*BINDING_KEYS,'TASK_ROOT')})\n\
        \    env['FLOORP_CENSUS_ABI']=str(abi)\n    phase='identity-snapshot'\n    result['census']=snapshot(load_abi(abi))['measurement']\n\
        \    with pathlib.Path(os.environ['GITHUB_ENV']).open('a') as output:\n        output.write('FLOORP_CENSUS_ABI='+str(abi)+'\\\
        n')\n    if True:\n        suites=[('checkpoint-tests',[sys.executable,'-m','unittest','-v',\n         \
        \   'test_checkpoint','test_process_census','test_guards','test_shim_failure_patch',\n            'test_completion_preflight','test_unittest_receipt','test_qa_core',\n\
        \            'test_darwin_inventory','test_inventory_timeout','test_helper_import_preflight',\n        \
        \    'test_checkpoint_transfer','test_checkpoint_replay','test_failure_excerpt',\n            'test_pipeline_restore','test_checkpoint_restore_replay','test_checkpoint_public',\n\
        \            'test_mozilla_harness_receipt','test_mozilla_harness_smoke',\n            'test_sdk_source','test_sdk_source_integration','test_consumer_time',\n\
        \            'test_build_completion','test_build_completion_contract','test_mozilla_target_build'],543,False),\n\
        \            ('failure-recording-tests',[sys.executable,'-m','unittest','discover','-v',\n            '-s',str(helper.parents[1]/'app-shim'),'-p','test_shim_failure_diagnostics.py'],14,True)]\n\
        \        for test_stage,command,expected,recording in suites:\n            phase=test_stage\n          \
        \  try:\n                runner.run(test_stage,command,helper,env,360,phase_deadline_minutes=15)\n     \
        \       finally:\n                result[test_stage]=unittest_receipt(task/(test_stage+'.private.log'),recording=recording)\n\
        \            tests=result[test_stage]\n            require(tests['complete'] and tests['status']=='passed'\
        \ and\n                    tests['total']==expected and tests['skipped']==0,'checkpoint-mac-tests')\n  \
        \  phase='owned-monitor-control'\n    script=\"import subprocess; [subprocess.run(['/bin/sh','-c','/bin/sleep\
        \ 0.1'],check=True) for _ in range(20)]\"\n    runner.run('monitor-preflight',[sys.executable,'-c',script],task,env,360,phase_deadline_minutes=15)\n\
        \    require(any(row['stage']=='monitor-preflight' and (row['lastActivity'] or {}).get('sampleComplete')\
        \ is True and\n                (row['lastActivity'] or {}).get('counterSource')=='libproc-taskallinfo' for\
        \ row in runner.records),\n            'monitor-preflight-no-complete-sample')\n    result['status']='passed'\n\
        except BaseException as error:\n    primary_error=error\n    result.update(status='failed',failurePhase=phase)\n\
        \    runner.fail('monitor-preflight','checkpoint-preflight-failure')\n    raise\nfinally:\n    result.update(stages=runner.records,monitorFailure=runner.monitor_failure,\n\
        \                  monitorDiagnostics=runner.monitor_diagnostics,firstFailure=runner.failure)\n    evidence_error=False\n\
        \    try:\n        write_json(task/'monitor-preflight.json',result)\n    except OSError:\n        evidence_error=True\n\
        \        runner.fail('preflight-evidence','checkpoint-preflight-evidence-write')\n        result.update(status='failed',evidenceWriteFailure=True,firstFailure=runner.failure)\n\
        \    print(json.dumps({'monitorPreflight':result}),flush=True)\n    if evidence_error and primary_error\
        \ is None:\n        require(False,'checkpoint-preflight-evidence-write')\nPYCODE\n"
    - name: Acquire the official unexpired renewed content-matched SDK
      timeout-minutes: 12
      env:
        SDK_READ_TOKEN: ${{ github.token }}
      shell: bash
      run: "\"$TASK_PYTHON\" - <<'PYCODE'\nimport hashlib,os,pathlib\npath=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'fixture/tools/qa/native-nonpgo/sdk_source.json'\n\
        raw=path.read_bytes()\nif len(raw)>65536 or hashlib.sha256(raw).hexdigest()!=os.environ['SDK_SOURCE_SHA256']:\n\
        \    raise SystemExit('sdk-source-pin-mismatch')\nPYCODE\n\"$TASK_PYTHON\" fixture/tools/qa/native-nonpgo/fetch_sdk.py\
        \ --plan fixture/tools/qa/native-nonpgo/plan.json --sdk-source fixture/tools/qa/native-nonpgo/sdk_source.json\
        \ --output \"$TASK_ROOT/sdk-download\"\n"
    - name: Checkout immutable Runtime source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ env.RUNTIME_SHA }}
        path: source
        persist-credentials: false
        fetch-depth: 1
        submodules: false
    - name: Checkout immutable native harness
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: Floorp-Projects/Floorp
        ref: ${{ env.HARNESS_SHA }}
        path: harness
        persist-credentials: false
        fetch-depth: 1
        sparse-checkout: tools/app-shim
    - name: Download only the verified successful producer checkpoint
      timeout-minutes: 25
      env:
        CHECKPOINT_READ_TOKEN: ${{ github.token }}
      shell: bash
      run: '"$TASK_PYTHON" fixture/tools/qa/native-nonpgo/checkpoint_transfer.py fetch --role consumer --task "$TASK_ROOT"
        --replay-origin

        '
    - name: Restore guarded state and build six Firefox roots plus Faster resources, then run three Mozilla cases
      id: pipeline
      env:
        CHECKPOINT_BUILD_DATE: '20261019035607'
      shell: bash
      run: '"$TASK_PYTHON" fixture/tools/qa/native-nonpgo/pipeline.py --source "$GITHUB_WORKSPACE/source" --fixture
        "$GITHUB_WORKSPACE/fixture" --harness "$GITHUB_WORKSPACE/harness" --task "$TASK_ROOT" --checkpoint-role
        consumer --replay-origin --mozilla-targeted --consumer-shared-deadline --sdk-source fixture/tools/qa/native-nonpgo/sdk_source.json
        > "$TASK_ROOT/pipeline.private.log"

        '
    - name: Verify targeted Firefox smoke, source pins and independent stage cleanup
      if: always()
      env:
        PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
      shell: bash
      run: "if [[ ! -x \"${TASK_PYTHON:-}\" || -z \"${TASK_ROOT:-}\" ]]; then\n  echo '{\"status\":\"failed\",\"\
        code\":\"initial-setup-incomplete\",\"rawSummaryPublished\":false}'\n  exit 1\nfi\n\"$TASK_PYTHON\" - <<'PYCODE'\n\
        import ast,hashlib,json,math,os,re,stat,sys,time,types\nfrom pathlib import Path\nsys.dont_write_bytecode=True\n\
        class Unconfirmed(Exception):pass\ndef need(value,code):\n    if not value:raise Unconfirmed(code)\n\ndef\
        \ identity(value):\n return tuple(getattr(value,key) for key in ('st_dev','st_ino','st_uid','st_mode','st_nlink','st_size','st_mtime_ns','st_ctime_ns'))\n\
        \ndef read_fixed(path,cap):\n path=Path(path)\n need(path.is_absolute() and path.resolve()==path,'binding')\n\
        \ directory=path.parent.stat();before=path.lstat()\n need(stat.S_ISDIR(directory.st_mode) and directory.st_uid==os.geteuid()\
        \ and\n  stat.S_ISREG(before.st_mode) and before.st_uid==os.geteuid() and before.st_nlink==1 and 0<=before.st_size<=cap,'binding')\n\
        \ fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|getattr(os,'O_NONBLOCK',0)|getattr(os,'O_CLOEXEC',0))\n try:\n\
        \  need(identity(before)==identity(os.fstat(fd)),'binding')\n  blocks=[];count=0\n  while True:\n   data=os.read(fd,min(131072,cap-count+1))\n\
        \   if not data:break\n   blocks.append(data);count+=len(data);need(count<=cap,'binding')\n  need(count==before.st_size\
        \ and identity(before)==identity(os.fstat(fd))==identity(path.lstat()) and\n   identity(directory)==identity(path.parent.stat()),'binding')\n\
        \  return b''.join(blocks)\n finally:os.close(fd)\n\ndef decode(raw):\n def pairs(items):\n  out={}\n  for\
        \ key,value in items:\n   need(key not in out,'receipt');out[key]=value\n  return out\n return json.loads(raw,object_pairs_hook=pairs,parse_constant=lambda\
        \ _:need(False,'receipt'))\ndef mapping(value):\n    return value if type(value) is dict else {}\n\ndef\
        \ integer(value, expected):\n    return type(value) is int and value == expected\n\ndef case_ok(value, label,\
        \ mode, code, status):\n    if type(value) is not dict:\n        return False\n    process=mapping(value.get('process'))\n\
        \    harness=mapping(value.get('harness'))\n    counts=mapping(harness.get('counts'))\n    end_statuses=mapping(counts.get('testEndStatuses'))\n\
        \    common=(value.get('case')==label and value.get('mode')==mode and\n            integer(value.get('expectedExitCode'),code)\
        \ and value.get('expectationSatisfied') is True and\n            value.get('monitorFailure') is None and\
        \ value.get('monitorFailureObserved') is False and\n            all(value.get(key) is None for key in ('caseError','evidenceWriteFailure','evidenceCollectionFailure'))\
        \ and\n            harness.get('status')==status and harness.get('expectationSatisfied') is True and\n \
        \           harness.get('completeLog') is True and harness.get('nativeQualification') is False and\n   \
        \         harness.get('buildQualification') is False and\n            all(process.get(key) is True for key\
        \ in ('available','exactReaped','groupGone','cleanupClean','monitorFailureAbsent')) and\n            integer(process.get('exitCode'),code)\
        \ and\n            all(integer(counts.get(key),1) for key in ('expectedTests','listedTests','suiteStarts','suiteEnds','testStarts','testEnds'))\
        \ and\n            all(integer(counts.get(key),0) for key in ('skips','crashes','timeouts','otherFailures','errorLogs','nonzeroProcessExits')))\n\
        \    if not common:\n        return False\n    if code==0:\n        natural=(value.get('runnerFailure')\
        \ is None and value.get('caughtCode') is None and\n                 process.get('reason') is None and process.get('failurePhase')\
        \ is None and\n                 integer(end_statuses.get('PASS'),1) and integer(end_statuses.get('FAIL'),0))\n\
        \        if label=='compiled-debug':\n            subtests=mapping(counts.get('subtestStatuses')).get('PASS')\n\
        \            natural=(natural and mapping(harness.get('markers')).get('debug') is True and\n           \
        \          type(subtests) is int and subtests>=3)\n        return natural\n    failure=mapping(value.get('runnerFailure'))\n\
        \    return (failure.get('stage')=='mozilla-xpcshell' and failure.get('code')=='nonzero-exit' and\n    \
        \        value.get('caughtCode')=='nonzero-exit' and process.get('reason')=='nonzero-exit' and\n       \
        \     process.get('failurePhase')=='wait' and integer(end_statuses.get('FAIL'),1) and\n            integer(end_statuses.get('PASS'),0)\
        \ and\n            all(integer(counts.get(key),1) for key in ('unexpectedSubtests','unexpectedTestEnds',\n\
        \                                                      'unexpectedFailSubtests','unexpectedFailTestEnds'))\
        \ and\n            mapping(harness.get('markers')).get('failure') is True)\n\ndef sdk_ok(value):\n    if\
        \ type(value) is not dict:\n        return False\n    sdk=mapping(value.get('sdk'))\n    acquired=mapping(sdk.get('acquisitionSource'))\n\
        \    anchor=mapping(acquired.get('uncompressedTar'))\n    return (value.get('planSHA256')=='33fb00c07a7ad9f66950489f06c0b5039ee173bc78297bc13b39265b24f4d460'\
        \ and\n            'sdkEvidenceError' not in value and\n            integer(sdk.get('artifact'),12182302735)\
        \ and integer(sdk.get('sourceRun'),39244172146) and\n            integer(sdk.get('attempt'),1) and\n   \
        \         sdk.get('zipSHA256')=='c2b125f6cba2e98aa6515d772b2300e458be8cc4236bf33028cd633ceb6624ee' and\n\
        \            sdk.get('tarSHA256')=='a190b3eee16abf546611a18c033c09ecc9e6bbb9b32ad83bb2c68f772ef95b6b' and\n\
        \            sdk.get('baselineTarSHA256')=='2002b346bf7087cc14f7b0e52bfc25ed767af29461ae1106356feaaec841dcc4'\
        \ and\n            sdk.get('canonicalSHA256')=='c3c01387c82e9ce1436fd517ec19308416663cc526c39be15f66f6bab22c3a5f'\
        \ and\n            set(acquired)=={'qualification','sourceSHA256','baselinePlanSHA256','uncompressedTar','producerJob'}\
        \ and\n            acquired.get('qualification')=='official-artifact-identical-uncompressed-tar-v1' and\n\
        \            acquired.get('sourceSHA256')=='ef5d0ed40f4f27b919df7a46323c63b7790ba325ce288a873b207858614bd688'\
        \ and\n            acquired.get('baselinePlanSHA256')=='33fb00c07a7ad9f66950489f06c0b5039ee173bc78297bc13b39265b24f4d460'\
        \ and\n            integer(acquired.get('producerJob'),118032017226) and set(anchor)=={'bytes','sha256'}\
        \ and\n            integer(anchor.get('bytes'),760518144) and\n            anchor.get('sha256')=='57aeb200890ba97c382bf450f23f9dab3e0d4696fdf02323a705f82210b087e3')\n\
        \ndef preflight_ok(value):\n    if type(value) is not dict:\n        return False\n    preflight=mapping(value.get('monitorPreflight'))\n\
        \    if not (preflight.get('status')=='passed' and 'firstFailure' in preflight and\n            preflight['firstFailure']\
        \ is None and 'monitorFailure' in preflight and\n            preflight['monitorFailure'] is None):\n   \
        \     return False\n    for name,total in (('checkpoint-tests',543),('failure-recording-tests',14)):\n \
        \       tests=mapping(preflight.get(name))\n        if not (tests.get('complete') is True and tests.get('status')=='passed'\
        \ and\n                integer(tests.get('total'),total) and all(integer(tests.get(key),0) for key in\n\
        \                    ('failures','errors','skipped'))):\n            return False\n    return True\n\ndef\
        \ time_budget_ok(value):\n    if type(value) is not dict:\n        return False\n    budget=mapping(value.get('executionTimeBudget'))\n\
        \    expected_keys={'schema','profile','baselinePlanSHA256','platformMinutes',\n        'sharedWorkDeadlineMinutes','cleanupReserveMinutes','clock','deadlineReference',\n\
        \        'deadlines','legacyDeadlines','onlyExecutionTimingChanged',\n        'resourceAndCompilationInputsChanged','clockResetAllowed','stageBudgetsAreAdditive'}\n\
        \    deadlines=mapping(budget.get('deadlines'))\n    legacy=mapping(budget.get('legacyDeadlines'))\n   \
        \ keys=('consumerRestoreDeadlineMinutes','consumerBuildDeadlineMinutes',\n          'consumerPackageDeadlineMinutes','consumerNativeDeadlineMinutes','finalDeadlineMinutes')\n\
        \    strings={'profile':'consumer-shared-final-deadline-v1',\n        'baselinePlanSHA256':'33fb00c07a7ad9f66950489f06c0b5039ee173bc78297bc13b39265b24f4d460',\n\
        \        'clock':'fresh-job-monotonic-origin','deadlineReference':'absolute-from-existing-job-origin'}\n\
        \    return (set(budget)==expected_keys and set(deadlines)==set(legacy)==set(keys) and\n            all(type(budget.get(key))\
        \ is str and budget[key]==expected for key,expected in strings.items()) and\n            integer(budget.get('schema'),1)\
        \ and integer(budget.get('platformMinutes'),360) and\n            integer(budget.get('sharedWorkDeadlineMinutes'),345)\
        \ and integer(budget.get('cleanupReserveMinutes'),15) and\n            all(integer(deadlines.get(key),expected)\
        \ for key,expected in zip(keys,(60,345,345,345,345))) and\n            all(integer(legacy.get(key),expected)\
        \ for key,expected in zip(keys,(60,300,315,335,345))) and\n            budget.get('onlyExecutionTimingChanged')\
        \ is True and\n            all(budget.get(key) is False for key in ('resourceAndCompilationInputsChanged',\n\
        \                'clockResetAllowed','stageBudgetsAreAdditive')))\n\ndef final_ok(value):\n    if type(value)\
        \ is not dict:\n        return False\n    mozilla=mapping(value.get('mozilla'))\n    inputs=mapping(mozilla.get('inputs'))\n\
        \    cases=mozilla.get('cases')\n    expected=[('compiled-debug','positive',0,'passed'),\n             \
        \ ('failure-control','negative-control',1,'failed'),\n              ('upstream-version-comparator','positive',0,'passed')]\n\
        \    return (time_budget_ok(value) and sdk_ok(value) and preflight_ok(value) and\n            value.get('status')=='mozilla-target-ready'\
