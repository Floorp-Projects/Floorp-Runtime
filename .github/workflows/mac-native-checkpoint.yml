# Immutable current-source Mozilla xpcshell smoke using the verified existing checkpoint.
name: Verified origin current-source Mozilla xpcshell smoke
'on':
  push:
    branches: [codex/mac-native-mozilla-smoke-recovery48-20261019]
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-intel-checkpoint-${{ github.ref }}
  cancel-in-progress: false
env:
  FLOORP_FIXTURE_SHA: 21f920f6790f78d923947886e0ddd8c6151da59a
  HARNESS_SHA: cbe45a7d7480d713b2c40a9ed348420126e6ccb0
  RUNTIME_SHA: 7dd619742b25567e479eeda97ae071d10542ad0b
jobs:
  consumer:
    name: checkpoint-consumer
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
      - name: Bound the initial authorized execution
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Floorp-Projects/Floorp-Runtime
          [[ "$FLOORP_FIXTURE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/codex/mac-native-mozilla-smoke-recovery48-20261019
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test '${{ github.event.created }}' = true
          test '${{ github.event.before }}' = 0000000000000000000000000000000000000000
          TASK_PYTHON="$RUNNER_TOOL_CACHE/Python/3.12.10/x64/bin/python3"
          test -x "$TASK_PYTHON"
          echo "TASK_PYTHON=$TASK_PYTHON" >> "$GITHUB_ENV"
          echo "TASK_ROOT=$RUNNER_TEMP/floorp-native-checkpoint" >> "$GITHUB_ENV"
      - name: Checkout immutable reviewed fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Floorp-Projects/Floorp
          ref: ${{ env.FLOORP_FIXTURE_SHA }}
          path: fixture
          persist-credentials: false
          fetch-depth: 1
      - name: Establish this job's fresh clock and task root
        timeout-minutes: 3
        env:
          CHECKPOINT_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          "$TASK_PYTHON" fixture/tools/qa/native-nonpgo/checkpoint_transfer.py init --role consumer --task "$TASK_ROOT"
      - name: Verify actual native process monitor before acquisition
        timeout-minutes: 10
        shell: bash
        run: |
          "$TASK_PYTHON" - <<'PYCODE'
          import json,os,pathlib,re,sys
          helper=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'fixture/tools/qa/native-nonpgo'
          sys.path.insert(0,str(helper))
          from support import Runner,clean_environment,require,write_json
          from darwin_activity import probe
          from unittest_receipt import receipt as unittest_receipt
          from process_census import BINDING_KEYS,prepare_abi,load_abi,snapshot
          task=pathlib.Path(os.environ['TASK_ROOT'])
          plan=json.loads((helper/'plan.json').read_text())
          runner=Runner(task,float((task/'started').read_text()),plan['limits'])
          env=clean_environment(task)
          temporary=task/'monitor-tmp'
          temporary.mkdir(mode=0o700)
          env['TMPDIR']=str(temporary)
          env['PYTHONDONTWRITEBYTECODE']='1'
          env['PYTHONWARNINGS']='error::ResourceWarning'
          env['PATH']+=':/usr/local/bin'
          result={'status':'failed'}
          primary_error=None
          phase='self-probe'
          try:
              own=probe().read(os.getpid(),os.getpgrp())
              require(own['status']=='measured' and own['rssMiB']>0,'monitor-native-self-unavailable')
              result['self']={key:own[key] for key in ('status','rssMiB','cpuSeconds','state')}
              phase='abi'
              abi=prepare_abi(task,runner,env)
              os.environ['FLOORP_CENSUS_ABI']=str(abi)
              env.update({key:os.environ[key] for key in (*BINDING_KEYS,'TASK_ROOT')})
              env['FLOORP_CENSUS_ABI']=str(abi)
              phase='identity-snapshot'
              result['census']=snapshot(load_abi(abi))['measurement']
              with pathlib.Path(os.environ['GITHUB_ENV']).open('a') as output:
                  output.write('FLOORP_CENSUS_ABI='+str(abi)+'\n')
              if True:
                  suites=[('checkpoint-tests',[sys.executable,'-m','unittest','-v',
                      'test_checkpoint','test_process_census','test_guards','test_shim_failure_patch',
                      'test_completion_preflight','test_unittest_receipt','test_qa_core',
                      'test_darwin_inventory','test_inventory_timeout','test_helper_import_preflight',
                      'test_checkpoint_transfer','test_checkpoint_replay','test_failure_excerpt',
                      'test_pipeline_restore','test_checkpoint_restore_replay','test_checkpoint_public',
                      'test_mozilla_harness_receipt','test_mozilla_harness_smoke',
                      'test_sdk_source','test_sdk_source_integration'],403,False),
                      ('failure-recording-tests',[sys.executable,'-m','unittest','discover','-v',
                      '-s',str(helper.parents[1]/'app-shim'),'-p','test_shim_failure_diagnostics.py'],14,True)]
                  for test_stage,command,expected,recording in suites:
                      phase=test_stage
                      try:
                          runner.run(test_stage,command,helper,env,360,phase_deadline_minutes=15)
                      finally:
                          result[test_stage]=unittest_receipt(task/(test_stage+'.private.log'),recording=recording)
                      tests=result[test_stage]
                      require(tests['complete'] and tests['status']=='passed' and
                              tests['total']==expected and tests['skipped']==0,'checkpoint-mac-tests')
              phase='owned-monitor-control'
              script="import subprocess; [subprocess.run(['/bin/sh','-c','/bin/sleep 0.1'],check=True) for _ in range(20)]"
              runner.run('monitor-preflight',[sys.executable,'-c',script],task,env,360,phase_deadline_minutes=15)
              require(any(row['stage']=='monitor-preflight' and (row['lastActivity'] or {}).get('sampleComplete') is True and
                          (row['lastActivity'] or {}).get('counterSource')=='libproc-taskallinfo' for row in runner.records),
                      'monitor-preflight-no-complete-sample')
              result['status']='passed'
          except BaseException as error:
              primary_error=error
              result.update(status='failed',failurePhase=phase)
              runner.fail('monitor-preflight','checkpoint-preflight-failure')
              raise
          finally:
              result.update(stages=runner.records,monitorFailure=runner.monitor_failure,
                            monitorDiagnostics=runner.monitor_diagnostics,firstFailure=runner.failure)
              evidence_error=False
              try:
                  write_json(task/'monitor-preflight.json',result)
              except OSError:
                  evidence_error=True
                  runner.fail('preflight-evidence','checkpoint-preflight-evidence-write')
                  result.update(status='failed',evidenceWriteFailure=True,firstFailure=runner.failure)
              print(json.dumps({'monitorPreflight':result}),flush=True)
              if evidence_error and primary_error is None:
                  require(False,'checkpoint-preflight-evidence-write')
          PYCODE
      - name: Acquire the official unexpired content-matched SDK
        timeout-minutes: 12
        env:
          SDK_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          "$TASK_PYTHON" fixture/tools/qa/native-nonpgo/fetch_sdk.py --plan fixture/tools/qa/native-nonpgo/plan.json --sdk-source fixture/tools/qa/native-nonpgo/sdk_source.json --output "$TASK_ROOT/sdk-download"
      - name: Checkout immutable Runtime source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RUNTIME_SHA }}
          path: source
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Checkout immutable native harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Floorp-Projects/Floorp
          ref: ${{ env.HARNESS_SHA }}
          path: harness
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: tools/app-shim
      - name: Download only the verified successful producer checkpoint
        timeout-minutes: 25
        env:
          CHECKPOINT_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          "$TASK_PYTHON" fixture/tools/qa/native-nonpgo/checkpoint_transfer.py fetch --role consumer --task "$TASK_ROOT" --replay-origin
      - name: Restore verified state and run current-source Mozilla xpcshell smoke after full host XUL build
        id: pipeline
        env:
          CHECKPOINT_BUILD_DATE: '20261019035607'
        shell: bash
        run: |
          "$TASK_PYTHON" fixture/tools/qa/native-nonpgo/pipeline.py --source "$GITHUB_WORKSPACE/source" --fixture "$GITHUB_WORKSPACE/fixture" --harness "$GITHUB_WORKSPACE/harness" --task "$TASK_ROOT" --checkpoint-role consumer --replay-origin --mozilla-only --sdk-source fixture/tools/qa/native-nonpgo/sdk_source.json
      - name: Confirm current-source Mozilla xpcshell smoke evidence
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          if [[ ! -x "${TASK_PYTHON:-}" || -z "${TASK_ROOT:-}" ]]; then
            echo '{"status":"failed","code":"initial-setup-incomplete"}'
            exit 1
          fi
          "$TASK_PYTHON" - <<'PYCODE'
          import json,os,pathlib
          task=pathlib.Path(os.environ['TASK_ROOT'])
          summary=task/'summary.json'
          if not summary.is_file():
              print(json.dumps({'status':'failed','code':'summary-missing'}),flush=True)
              raise SystemExit(1)
          value=json.loads(summary.read_text())
          def mapping(value):
              return value if type(value) is dict else {}
          def integer(value, expected):
              return type(value) is int and value == expected
          def case_ok(value, label, mode, code, status):
              if type(value) is not dict:
                  return False
              process=mapping(value.get('process'))
              harness=mapping(value.get('harness'))
              counts=mapping(harness.get('counts'))
              end_statuses=mapping(counts.get('testEndStatuses'))
              common=(value.get('case')==label and value.get('mode')==mode and
                      integer(value.get('expectedExitCode'),code) and value.get('expectationSatisfied') is True and
                      value.get('monitorFailure') is None and value.get('monitorFailureObserved') is False and
                      all(value.get(key) is None for key in ('caseError','evidenceWriteFailure','evidenceCollectionFailure')) and
                      harness.get('status')==status and harness.get('expectationSatisfied') is True and
                      harness.get('completeLog') is True and harness.get('nativeQualification') is False and
                      harness.get('buildQualification') is False and
                      all(process.get(key) is True for key in ('available','exactReaped','groupGone','cleanupClean','monitorFailureAbsent')) and
                      integer(process.get('exitCode'),code) and
                      all(integer(counts.get(key),1) for key in ('expectedTests','listedTests','suiteStarts','suiteEnds','testStarts','testEnds')) and
                      all(integer(counts.get(key),0) for key in ('skips','crashes','timeouts','otherFailures','errorLogs','nonzeroProcessExits')))
              if not common:
                  return False
              if code==0:
                  natural=(value.get('runnerFailure') is None and value.get('caughtCode') is None and
                           process.get('reason') is None and process.get('failurePhase') is None and
                           integer(end_statuses.get('PASS'),1) and integer(end_statuses.get('FAIL'),0))
                  if label=='compiled-debug':
                      subtests=mapping(counts.get('subtestStatuses')).get('PASS')
                      natural=(natural and mapping(harness.get('markers')).get('debug') is True and
                               type(subtests) is int and subtests>=3)
                  return natural
              failure=mapping(value.get('runnerFailure'))
              return (failure.get('stage')=='mozilla-xpcshell' and failure.get('code')=='nonzero-exit' and
                      value.get('caughtCode')=='nonzero-exit' and process.get('reason')=='nonzero-exit' and
                      process.get('failurePhase')=='wait' and integer(end_statuses.get('FAIL'),1) and
                      integer(end_statuses.get('PASS'),0) and
                      all(integer(counts.get(key),1) for key in ('unexpectedSubtests','unexpectedTestEnds',
                                                                'unexpectedFailSubtests','unexpectedFailTestEnds')) and
                      mapping(harness.get('markers')).get('failure') is True)
          def sdk_ok(value):
              if type(value) is not dict:
                  return False
              sdk=mapping(value.get('sdk'))
              acquired=mapping(sdk.get('acquisitionSource'))
              anchor=mapping(acquired.get('uncompressedTar'))
              return (value.get('planSHA256')=='33fb00c07a7ad9f66950489f06c0b5039ee173bc78297bc13b39265b24f4d460' and
                      'sdkEvidenceError' not in value and
                      integer(sdk.get('artifact'),12149860607) and integer(sdk.get('sourceRun'),39162639256) and
                      integer(sdk.get('attempt'),1) and
                      sdk.get('zipSHA256')=='2891f1867cd3e53a4cf6d25da9128b345a626a9b0aed97bdc25e283699c14e2b' and
                      sdk.get('tarSHA256')=='f306df0484aa958803d50943e39dde51b740dca97ac44625b42c3839867a5328' and
                      sdk.get('baselineTarSHA256')=='2002b346bf7087cc14f7b0e52bfc25ed767af29461ae1106356feaaec841dcc4' and
                      sdk.get('canonicalSHA256')=='c3c01387c82e9ce1436fd517ec19308416663cc526c39be15f66f6bab22c3a5f' and
                      set(acquired)=={'qualification','sourceSHA256','baselinePlanSHA256','uncompressedTar','producerJob'} and
                      acquired.get('qualification')=='official-artifact-identical-uncompressed-tar-v1' and
                      acquired.get('sourceSHA256')=='844cd4f9b47e7a271fe8bdf0731c3731c49f236e22c1e26b5b2c249a8cbf3d25' and
                      acquired.get('baselinePlanSHA256')=='33fb00c07a7ad9f66950489f06c0b5039ee173bc78297bc13b39265b24f4d460' and
                      integer(acquired.get('producerJob'),117779018335) and set(anchor)=={'bytes','sha256'} and
                      integer(anchor.get('bytes'),760518144) and
                      anchor.get('sha256')=='57aeb200890ba97c382bf450f23f9dab3e0d4696fdf02323a705f82210b087e3')
          def preflight_ok(value):
              if type(value) is not dict:
                  return False
              preflight=mapping(value.get('monitorPreflight'))
              if not (preflight.get('status')=='passed' and 'firstFailure' in preflight and
                      preflight['firstFailure'] is None and 'monitorFailure' in preflight and
                      preflight['monitorFailure'] is None):
                  return False
              for name,total in (('checkpoint-tests',403),('failure-recording-tests',14)):
                  tests=mapping(preflight.get(name))
                  if not (tests.get('complete') is True and tests.get('status')=='passed' and
                          integer(tests.get('total'),total) and all(integer(tests.get(key),0) for key in
                              ('failures','errors','skipped'))):
                      return False
              return True
          def final_ok(value):
              if type(value) is not dict:
                  return False
              mozilla=mapping(value.get('mozilla'))
              inputs=mapping(mozilla.get('inputs'))
              cases=mozilla.get('cases')
              expected=[('compiled-debug','positive',0,'passed'),
                        ('failure-control','negative-control',1,'failed'),
                        ('upstream-version-comparator','positive',0,'passed')]
              return (sdk_ok(value) and preflight_ok(value) and
                      value.get('status')=='mozilla-ready' and value.get('mozillaOnly') is True and
                      'firstFailure' in value and value['firstFailure'] is None and
                      'monitorFailure' in value and value['monitorFailure'] is None and
                      value.get('resumedEffectiveConfigVerified') is True and
                      mapping(value.get('checkpointRestore')).get('qualification')=='verified-origin-cross-run-checkpoint-replay-v1' and
                      mapping(value.get('checkpointReplayContext')).get('status')=='passed' and
                      value.get('qualification')=='verified-origin-current-mozilla-xpcshell-smoke' and
                      value.get('fullHostXUL')=='passed' and value.get('stagePackage')=='NOT_TESTED' and
                      value.get('nativeAuthentication')=='NOT_TESTED' and value.get('native') is None and
                      all(value.get(key) is False for key in ('productQualification','freshObjdir','sameJob','retry')) and
                      integer(value.get('newArtifacts'),0) and
                      mozilla.get('status')=='passed' and mozilla.get('contract')=='current-source-mozilla-xpcshell-smoke-v1' and
                      mozilla.get('monitorFailure') is None and mozilla.get('productQualification') is False and
                      mozilla.get('nativeAuthentication')=='NOT_TESTED' and
                      all(mozilla.get(key) is True for key in ('actualCompiledDebug','actualCurrentSourceUpstreamTest',
                          'intentionalFailureDetected','allCasesExactReaped','allCasesGroupsGone','defaultUpstreamHeadLoaded',
                          'verbose','sequential')) and mozilla.get('automaticRetry') is False and integer(mozilla.get('threads'),1) and
                      inputs.get('sourceCommit')=='7dd619742b25567e479eeda97ae071d10542ad0b' and
                      integer(inputs.get('sourceFilesVerified'),18) and integer(inputs.get('fixtureFilesVerified'),4) and
                      type(cases) is list and len(cases)==3 and
                      all(case_ok(case,*spec) for case,spec in zip(cases,expected)))
          passed=final_ok(value)
          sdk_verified=sdk_ok(value)
          print(json.dumps({'role':'consumer','status':'passed' if passed else 'failed',
                            'qualification':'verified-origin-current-mozilla-xpcshell-smoke','originRun':39197008470,
                            'existingArtifact':12164479528,'newArtifactUploads':0,
                            'sdkSourceVerified':sdk_verified,
                            'sdkArtifact':12149860607 if sdk_verified else None,
                            'sdkSourceRun':39162639256 if sdk_verified else None,
                            'sdkProducerJob':117779018335 if sdk_verified else None,
                            'sdkSourceSHA256':'844cd4f9b47e7a271fe8bdf0731c3731c49f236e22c1e26b5b2c249a8cbf3d25' if sdk_verified else None,
                            'sdkQualification':'official-artifact-identical-uncompressed-tar-v1' if sdk_verified else None,
                            'nativeAuthentication':'NOT_TESTED','stagePackage':'NOT_TESTED',
                            'productQualification':False,'freshObjdir':False,'sameJob':False}),flush=True)
          raise SystemExit(0 if passed else 1)
          PYCODE
