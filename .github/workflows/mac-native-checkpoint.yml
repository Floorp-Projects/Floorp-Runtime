        \   value.get('qualification')=='verified-origin-root-target-mozilla-smoke-v1' and\n            value.get('fullHostXUL')=='NOT_TESTED'\
        \ and value.get('fullHostQualification') is False and value.get('stagePackage')=='NOT_TESTED' and\n    \
        \        value.get('nativeAuthentication')=='NOT_TESTED' and value.get('native') is None and\n         \
        \   all(value.get(key) is False for key in ('productQualification','freshObjdir','sameJob','retry')) and\n\
        \            integer(value.get('newArtifacts'),0) and\n            mozilla.get('status')=='passed' and mozilla.get('contract')=='current-source-mozilla-xpcshell-smoke-v1'\
        \ and\n            mozilla.get('monitorFailure') is None and mozilla.get('productQualification') is False\
        \ and\n            mozilla.get('nativeAuthentication')=='NOT_TESTED' and\n            all(mozilla.get(key)\
        \ is True for key in ('actualCompiledDebug','actualCurrentSourceUpstreamTest',\n                'intentionalFailureDetected','allCasesExactReaped','allCasesGroupsGone','defaultUpstreamHeadLoaded',\n\
        \                'verbose','sequential')) and mozilla.get('automaticRetry') is False and integer(mozilla.get('threads'),1)\
        \ and\n            inputs.get('sourceCommit')=='7dd619742b25567e479eeda97ae071d10542ad0b' and\n        \
        \    integer(inputs.get('sourceFilesVerified'),18) and integer(inputs.get('fixtureFilesVerified'),4) and\n\
        \            type(cases) is list and len(cases)==3 and\n            all(case_ok(case,*spec) for case,spec\
        \ in zip(cases,expected)))\n\nSOURCE_FAILURE_CODES=frozenset()\nTARGET_STAGES=('mozilla-shell-build','mozilla-http3-build','mozilla-browser-build','mozilla-updater-build','mozilla-channel-build','mozilla-dmg-build','mozilla-resources-build')\n\
