# SDKless fixed-upstream serializer contract; no real build or Mozilla qualification.
name: Fixed upstream build completion serializer contract
'on':
  push:
    branches: [codex/mac-native-build-completion-recovery49-20261019]
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-intel-checkpoint-${{ github.ref }}
  cancel-in-progress: false
env:
  FLOORP_FIXTURE_SHA: 73b5c6b71be98104bfaa8ba641602b603838d5d5
  HARNESS_SHA: cbe45a7d7480d713b2c40a9ed348420126e6ccb0
  RUNTIME_SHA: 7dd619742b25567e479eeda97ae071d10542ad0b
jobs:
  consumer:
    name: checkpoint-consumer
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
      - name: Bound the initial authorized execution
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Floorp-Projects/Floorp-Runtime
          [[ "$FLOORP_FIXTURE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/codex/mac-native-build-completion-recovery49-20261019
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test '${{ github.event.created }}' = true
          test '${{ github.event.before }}' = 0000000000000000000000000000000000000000
          TASK_PYTHON="$RUNNER_TOOL_CACHE/Python/3.12.10/x64/bin/python3"
          test -x "$TASK_PYTHON"
          echo "TASK_PYTHON=$TASK_PYTHON" >> "$GITHUB_ENV"
          echo "TASK_ROOT=$RUNNER_TEMP/floorp-native-checkpoint" >> "$GITHUB_ENV"
      - name: Checkout immutable reviewed fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Floorp-Projects/Floorp
          ref: ${{ env.FLOORP_FIXTURE_SHA }}
          path: fixture
          persist-credentials: false
          fetch-depth: 1
      - name: Establish this job's fresh clock and task root
        timeout-minutes: 3
        env:
          CHECKPOINT_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          "$TASK_PYTHON" fixture/tools/qa/native-nonpgo/checkpoint_transfer.py init --role consumer --task "$TASK_ROOT"
      - name: Verify actual native process monitor before acquisition
        timeout-minutes: 10
        shell: bash
        run: |
          "$TASK_PYTHON" - <<'PYCODE'
          import json,os,pathlib,re,sys
          helper=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'fixture/tools/qa/native-nonpgo'
          sys.path.insert(0,str(helper))
          from support import Runner,clean_environment,require,write_json
          from darwin_activity import probe
          from unittest_receipt import receipt as unittest_receipt
          from process_census import BINDING_KEYS,prepare_abi,load_abi,snapshot
          task=pathlib.Path(os.environ['TASK_ROOT'])
          plan=json.loads((helper/'plan.json').read_text())
          runner=Runner(task,float((task/'started').read_text()),plan['limits'])
          env=clean_environment(task)
          temporary=task/'monitor-tmp'
          temporary.mkdir(mode=0o700)
          env['TMPDIR']=str(temporary)
          env['PYTHONDONTWRITEBYTECODE']='1'
          env['PYTHONWARNINGS']='error::ResourceWarning'
          env['PATH']+=':/usr/local/bin'
          result={'status':'failed'}
          primary_error=None
          phase='self-probe'
          try:
              own=probe().read(os.getpid(),os.getpgrp())
              require(own['status']=='measured' and own['rssMiB']>0,'monitor-native-self-unavailable')
              result['self']={key:own[key] for key in ('status','rssMiB','cpuSeconds','state')}
              phase='abi'
              abi=prepare_abi(task,runner,env)
              os.environ['FLOORP_CENSUS_ABI']=str(abi)
              env.update({key:os.environ[key] for key in (*BINDING_KEYS,'TASK_ROOT')})
              env['FLOORP_CENSUS_ABI']=str(abi)
              phase='identity-snapshot'
              result['census']=snapshot(load_abi(abi))['measurement']
              with pathlib.Path(os.environ['GITHUB_ENV']).open('a') as output:
                  output.write('FLOORP_CENSUS_ABI='+str(abi)+'\n')
              if True:
                  suites=[('checkpoint-tests',[sys.executable,'-m','unittest','-v',
                      'test_checkpoint','test_process_census','test_guards','test_shim_failure_patch',
                      'test_completion_preflight','test_unittest_receipt','test_qa_core',
                      'test_darwin_inventory','test_inventory_timeout','test_helper_import_preflight',
                      'test_checkpoint_transfer','test_checkpoint_replay','test_failure_excerpt',
                      'test_pipeline_restore','test_checkpoint_restore_replay','test_checkpoint_public',
                      'test_mozilla_harness_receipt','test_mozilla_harness_smoke',
                      'test_sdk_source','test_sdk_source_integration','test_consumer_time',
                      'test_build_completion','test_build_completion_contract'],491,False),
                      ('failure-recording-tests',[sys.executable,'-m','unittest','discover','-v',
                      '-s',str(helper.parents[1]/'app-shim'),'-p','test_shim_failure_diagnostics.py'],14,True)]
                  for test_stage,command,expected,recording in suites:
                      phase=test_stage
                      try:
                          runner.run(test_stage,command,helper,env,360,phase_deadline_minutes=15)
                      finally:
                          result[test_stage]=unittest_receipt(task/(test_stage+'.private.log'),recording=recording)
                      tests=result[test_stage]
                      require(tests['complete'] and tests['status']=='passed' and
                              tests['total']==expected and tests['skipped']==0,'checkpoint-mac-tests')
              phase='owned-monitor-control'
              script="import subprocess; [subprocess.run(['/bin/sh','-c','/bin/sleep 0.1'],check=True) for _ in range(20)]"
              runner.run('monitor-preflight',[sys.executable,'-c',script],task,env,360,phase_deadline_minutes=15)
              require(any(row['stage']=='monitor-preflight' and (row['lastActivity'] or {}).get('sampleComplete') is True and
                          (row['lastActivity'] or {}).get('counterSource')=='libproc-taskallinfo' for row in runner.records),
                      'monitor-preflight-no-complete-sample')
              result['status']='passed'
          except BaseException as error:
              primary_error=error
              result.update(status='failed',failurePhase=phase)
              runner.fail('monitor-preflight','checkpoint-preflight-failure')
              raise
          finally:
              result.update(stages=runner.records,monitorFailure=runner.monitor_failure,
                            monitorDiagnostics=runner.monitor_diagnostics,firstFailure=runner.failure)
              evidence_error=False
              try:
                  write_json(task/'monitor-preflight.json',result)
              except OSError:
                  evidence_error=True
                  runner.fail('preflight-evidence','checkpoint-preflight-evidence-write')
                  result.update(status='failed',evidenceWriteFailure=True,firstFailure=runner.failure)
              print(json.dumps({'monitorPreflight':result}),flush=True)
              if evidence_error and primary_error is None:
                  require(False,'checkpoint-preflight-evidence-write')
          PYCODE
      - name: Fetch only the immutable upstream serializer source
        timeout-minutes: 3
        env:
          PROFILE_SOURCE_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          "$TASK_PYTHON" - <<'PYCODE'
          import hashlib,json,os,pathlib,time,urllib.request
          from urllib.error import HTTPError,URLError

          task=pathlib.Path(os.environ['TASK_ROOT'])
          result={'schema':1,'status':'failed','runtimeRef':'7dd619742b25567e479eeda97ae071d10542ad0b',
                  'bytes':None,'sha256':None,'officialContentsAPI':True,'tokenPublished':False}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  raise RuntimeError('redirect-rejected')
          try:
              started=time.monotonic()
              url=('https://api.github.com/repos/Floorp-Projects/Floorp-Runtime/contents/'
                   'testing/mozbase/mozsystemmonitor/mozsystemmonitor/resourcemonitor.py'
                   '?ref=7dd619742b25567e479eeda97ae071d10542ad0b')
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['PROFILE_SOURCE_READ_TOKEN'],
                  'Accept':'application/vnd.github.raw+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.build_opener(NoRedirect).open(request,timeout=30) as response:
                  if response.status!=200:raise RuntimeError('status')
                  raw=response.read(1024**2+1)
              if time.monotonic()-started>90 or len(raw)!=126050:raise RuntimeError('size-or-deadline')
              sha=hashlib.sha256(raw).hexdigest()
              if sha!='5f2f9572658fc19d342b5e56904ce110eeb258ff57c4e5d8614a8b0b5b7d1eaf':raise RuntimeError('hash')
              destination=task/'profile-serializer-source'
              destination.mkdir(mode=0o700,exist_ok=False)
              with (destination/'resourcemonitor.py').open('xb') as output:
                  os.fchmod(output.fileno(),0o600);output.write(raw)
              result.update(status='passed',bytes=len(raw),sha256=sha)
          except BaseException:
              result['code']='fixed-profile-source-acquisition-failed'
          finally:
              try:
                  receipt=task/'profile-serializer-source.json'
                  receipt.write_text(json.dumps(result,sort_keys=True)+'\n');receipt.chmod(0o600)
              except BaseException:
                  result.update(status='failed',code='fixed-profile-source-evidence-write-failed')
              finally:
                  print(json.dumps({'upstreamSerializerSourceAcquisition':result}),flush=True)
          if result['status']!='passed':raise SystemExit(1)
          PYCODE
      - name: Observe the actual serializer contract in an owned monitored stage
        timeout-minutes: 15
        shell: bash
        run: |
          "$TASK_PYTHON" - <<'PYCODE'
          def integer(value,expected):
              return type(value) is int and value==expected

          def contract_ok(value):
              if type(value) is not dict:return False
              fixed={'schema','status','qualification','runtimeRef','sourceSHA256','sourceBytes',
                  'actualSerializerSourceVerified','serializerBackend','syntheticClockAndMarkers',
                  'resourceSamplesCollected','workerStarted','realBuildPerformed','mozillaQualification',
                  'fullBuildQualification','resourceQualification','bothFormatsObserved',
                  'negativeInputsDidNotConfirmTargets','cases','firstFailure','taskCreated','receiptWriteFailure'}
              if set(value)!=fixed:return False
              if not (integer(value.get('schema'),1) and integer(value.get('sourceBytes'),126050) and
                  value.get('status')=='observed-both-formats' and
                  value.get('qualification')=='synthetic-serializer-contract-actual-source' and
                  value.get('runtimeRef')=='7dd619742b25567e479eeda97ae071d10542ad0b' and
                  value.get('sourceSHA256')=='5f2f9572658fc19d342b5e56904ce110eeb258ff57c4e5d8614a8b0b5b7d1eaf' and
                  value.get('serializerBackend')=='upstream-PsutilStub' and
                  all(value.get(k) is True for k in ('actualSerializerSourceVerified','syntheticClockAndMarkers',
                      'bothFormatsObserved','negativeInputsDidNotConfirmTargets','taskCreated')) and
                  all(value.get(k) is False for k in ('resourceSamplesCollected','workerStarted','realBuildPerformed',
                      'mozillaQualification','fullBuildQualification','resourceQualification')) and
                  value.get('firstFailure') is None and value.get('receiptWriteFailure') is None):return False
              cases=value.get('cases')
              if type(cases) is not list or len(cases)!=6:return False
              expected=[(f,c) for f in ('jsonl','whole-profile') for c in ('positive','no-end','truncated')]
              for row,(profile_format,control) in zip(cases,expected):
                  if type(row) is not dict or set(row)!={'format','control','cleanup','observation','expectationSatisfied'}:return False
                  if row.get('format')!=profile_format or row.get('control')!=control or row.get('expectationSatisfied') is not True:return False
                  cleanup=row.get('cleanup')
                  keys={'streamClosed','parentPipeClosed','childPipeClosed','processClosed','workerNeverStarted','failures'}
                  if type(cleanup) is not dict or set(cleanup)!=keys or cleanup.get('failures')!=[]:return False
                  if not all(cleanup.get(k) is True for k in keys-{'failures'}):return False
                  observed=row.get('observation')
                  if type(observed) is not dict or set(observed)!={'status','profileFormat','completeCoverage','lastFinishedTier',
                      'targets','finishedTargetCounts','provesBuildCompletion','provesCacheHit'}:return False
                  if observed.get('provesBuildCompletion') is not False or observed.get('provesCacheHit') is not False:return False
                  targets=observed.get('targets');counts=observed.get('finishedTargetCounts');last=observed.get('lastFinishedTier')
                  if type(targets) is not dict or set(targets)!={'XUL','xpcshell'}:return False
                  if type(counts) is not dict or set(counts)!={'SharedLib','Program'}:return False
                  if type(last) is not dict or set(last)!={'tier','endTimeMs'}:return False
                  for target in targets.values():
                      if type(target) is not dict or set(target)!={'status','endTimeMs'}:return False
                  if control=='positive':
                      if not (observed.get('status')=='observed' and observed.get('profileFormat')==profile_format and
                          observed.get('completeCoverage') is True and last=={'tier':'compile','endTimeMs':40000.0} and
                          targets=={'XUL':{'status':'observed-finished','endTimeMs':35000.0},
                                   'xpcshell':{'status':'observed-finished','endTimeMs':30000.0}} and
                          all(integer(counts[k],2) for k in counts)):return False
                  else:
                      if last!={'tier':None,'endTimeMs':None}:return False
                      if any(t!={'status':'unconfirmed','endTimeMs':None} for t in targets.values()):return False
                      if control=='no-end':
                          if not (observed.get('status')=='observed' and observed.get('profileFormat')==profile_format and
                              observed.get('completeCoverage') is True and all(integer(counts[k],0) for k in counts)):return False
                      elif not (observed.get('status')=='unconfirmed' and observed.get('profileFormat') is None and
                          observed.get('completeCoverage') is False and all(counts[k] is None for k in counts)):return False
              return True

          def source_ok(value):
              return (type(value) is dict and set(value)=={'schema','status','runtimeRef','bytes','sha256','officialContentsAPI','tokenPublished'} and
                  integer(value.get('schema'),1) and integer(value.get('bytes'),126050) and value.get('status')=='passed' and
                  value.get('runtimeRef')=='7dd619742b25567e479eeda97ae071d10542ad0b' and
                  value.get('sha256')=='5f2f9572658fc19d342b5e56904ce110eeb258ff57c4e5d8614a8b0b5b7d1eaf' and
                  value.get('officialContentsAPI') is True and value.get('tokenPublished') is False)

          import json,os,pathlib,sys
          helper=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'fixture/tools/qa/native-nonpgo'
          sys.path.insert(0,str(helper))
          from support import Runner,clean_environment,require,write_json
          from process_census import BINDING_KEYS,load_abi
          from helper_import_preflight import stage_projection,monitor_projection,runner_failure
          from build_completion_contract import safe_error

          task=pathlib.Path(os.environ['TASK_ROOT']).resolve()
          plan=json.loads((helper/'plan.json').read_text())
          runner=Runner(task,float((task/'started').read_text()),plan['limits'])
          result={'schema':1,'status':'failed','contractVerified':False,'firstFailure':None,'driverFailure':None,
                  'monitorFailure':None,'monitorFailureObserved':False,'monitorDiagnostics':[],
                  'stages':[],'outstandingGroups':None,'evidenceWriteFailure':False}
          phase='source'
          try:
              require(source_ok(json.loads((task/'profile-serializer-source.json').read_text())),'contract-source-hash')
              phase='snapshot'
              load_abi(pathlib.Path(os.environ['FLOORP_CENSUS_ABI']))
              env=clean_environment(task)
              env.update({key:os.environ[key] for key in (*BINDING_KEYS,'TASK_ROOT','FLOORP_CENSUS_ABI')})
              env.update(PYTHONDONTWRITEBYTECODE='1',PYTHONWARNINGS='error::ResourceWarning')
              env['PATH']+=':/usr/local/bin';env['TMPDIR']=str(task/'monitor-tmp')
              phase='serializer'
              runner.run('build-completion-contract',[sys.executable,str(helper/'build_completion_contract.py'),
                  '--runtime-profile-source',str(task/'profile-serializer-source/resourcemonitor.py'),
                  '--task',str(task/'build-completion-contract-probe')],task,env,360,phase_deadline_minutes=15)
              phase='observation'
              value=json.loads((task/'build-completion-contract-probe/build-completion-contract.json').read_text())
              result['contractVerified']=contract_ok(value)
              require(result['contractVerified'],'contract-observation')
              phase='cleanup'
              require(runner.failure is None and runner.monitor_failure is None and not runner.groups and len(runner.records)==1 and
                  all(row['exitCode']==0 and row['groupCleanup']=='verified-gone' and row['leaderReap']=={'status':'reaped','exitCode':0} and
                  row['cleanupFailure'] is None for row in runner.records),'contract-cleanup')
              result['status']='passed'
          except BaseException as error:
              result['driverFailure']=safe_error(error,phase)
              runner.fail('build-completion-contract','build-completion-contract-driver-failed')
          finally:
              result.update(firstFailure=runner_failure(runner.failure),monitorFailure=monitor_projection(runner.monitor_failure),
                  monitorFailureObserved=runner.monitor_failure is not None,
                  monitorDiagnostics=[monitor_projection(row) for row in runner.monitor_diagnostics[-16:]],
                  outstandingGroups=bool(runner.groups),
                  stages=[{**stage_projection(row),'stage':'build-completion-contract' if row.get('stage')=='build-completion-contract' else 'other'}
                          for row in runner.records])
              try:
                  write_json(task/'build-completion-contract-driver.json',result)
              except BaseException:
                  result.update(status='failed',evidenceWriteFailure=True)
                  runner.fail('build-completion-contract','contract-receipt-write')
                  result['firstFailure']=runner_failure(runner.failure)
              finally:
                  print(json.dumps({'buildCompletionContractDriver':result}),flush=True)
          if result['status']!='passed':raise SystemExit(1)
          PYCODE
      - name: Verify SDKless serializer proof and independent cleanup
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          if [[ ! -x "${TASK_PYTHON:-}" || -z "${TASK_ROOT:-}" ]]; then
            echo '{"status":"failed","code":"initial-setup-incomplete"}'
            exit 1
          fi
          "$TASK_PYTHON" - <<'PYCODE'
          def integer(value,expected):
              return type(value) is int and value==expected

          def contract_ok(value):
              if type(value) is not dict:return False
              fixed={'schema','status','qualification','runtimeRef','sourceSHA256','sourceBytes',
                  'actualSerializerSourceVerified','serializerBackend','syntheticClockAndMarkers',
                  'resourceSamplesCollected','workerStarted','realBuildPerformed','mozillaQualification',
                  'fullBuildQualification','resourceQualification','bothFormatsObserved',
                  'negativeInputsDidNotConfirmTargets','cases','firstFailure','taskCreated','receiptWriteFailure'}
              if set(value)!=fixed:return False
              if not (integer(value.get('schema'),1) and integer(value.get('sourceBytes'),126050) and
                  value.get('status')=='observed-both-formats' and
                  value.get('qualification')=='synthetic-serializer-contract-actual-source' and
                  value.get('runtimeRef')=='7dd619742b25567e479eeda97ae071d10542ad0b' and
                  value.get('sourceSHA256')=='5f2f9572658fc19d342b5e56904ce110eeb258ff57c4e5d8614a8b0b5b7d1eaf' and
                  value.get('serializerBackend')=='upstream-PsutilStub' and
                  all(value.get(k) is True for k in ('actualSerializerSourceVerified','syntheticClockAndMarkers',
                      'bothFormatsObserved','negativeInputsDidNotConfirmTargets','taskCreated')) and
                  all(value.get(k) is False for k in ('resourceSamplesCollected','workerStarted','realBuildPerformed',
                      'mozillaQualification','fullBuildQualification','resourceQualification')) and
                  value.get('firstFailure') is None and value.get('receiptWriteFailure') is None):return False
              cases=value.get('cases')
              if type(cases) is not list or len(cases)!=6:return False
              expected=[(f,c) for f in ('jsonl','whole-profile') for c in ('positive','no-end','truncated')]
              for row,(profile_format,control) in zip(cases,expected):
                  if type(row) is not dict or set(row)!={'format','control','cleanup','observation','expectationSatisfied'}:return False
                  if row.get('format')!=profile_format or row.get('control')!=control or row.get('expectationSatisfied') is not True:return False
                  cleanup=row.get('cleanup')
                  keys={'streamClosed','parentPipeClosed','childPipeClosed','processClosed','workerNeverStarted','failures'}
                  if type(cleanup) is not dict or set(cleanup)!=keys or cleanup.get('failures')!=[]:return False
                  if not all(cleanup.get(k) is True for k in keys-{'failures'}):return False
                  observed=row.get('observation')
                  if type(observed) is not dict or set(observed)!={'status','profileFormat','completeCoverage','lastFinishedTier',
                      'targets','finishedTargetCounts','provesBuildCompletion','provesCacheHit'}:return False
                  if observed.get('provesBuildCompletion') is not False or observed.get('provesCacheHit') is not False:return False
                  targets=observed.get('targets');counts=observed.get('finishedTargetCounts');last=observed.get('lastFinishedTier')
                  if type(targets) is not dict or set(targets)!={'XUL','xpcshell'}:return False
                  if type(counts) is not dict or set(counts)!={'SharedLib','Program'}:return False
                  if type(last) is not dict or set(last)!={'tier','endTimeMs'}:return False
                  for target in targets.values():
                      if type(target) is not dict or set(target)!={'status','endTimeMs'}:return False
                  if control=='positive':
                      if not (observed.get('status')=='observed' and observed.get('profileFormat')==profile_format and
                          observed.get('completeCoverage') is True and last=={'tier':'compile','endTimeMs':40000.0} and
                          targets=={'XUL':{'status':'observed-finished','endTimeMs':35000.0},
                                   'xpcshell':{'status':'observed-finished','endTimeMs':30000.0}} and
                          all(integer(counts[k],2) for k in counts)):return False
                  else:
                      if last!={'tier':None,'endTimeMs':None}:return False
                      if any(t!={'status':'unconfirmed','endTimeMs':None} for t in targets.values()):return False
                      if control=='no-end':
                          if not (observed.get('status')=='observed' and observed.get('profileFormat')==profile_format and
                              observed.get('completeCoverage') is True and all(integer(counts[k],0) for k in counts)):return False
                      elif not (observed.get('status')=='unconfirmed' and observed.get('profileFormat') is None and
                          observed.get('completeCoverage') is False and all(counts[k] is None for k in counts)):return False
              return True

          def source_ok(value):
              return (type(value) is dict and set(value)=={'schema','status','runtimeRef','bytes','sha256','officialContentsAPI','tokenPublished'} and
                  integer(value.get('schema'),1) and integer(value.get('bytes'),126050) and value.get('status')=='passed' and
                  value.get('runtimeRef')=='7dd619742b25567e479eeda97ae071d10542ad0b' and
                  value.get('sha256')=='5f2f9572658fc19d342b5e56904ce110eeb258ff57c4e5d8614a8b0b5b7d1eaf' and
                  value.get('officialContentsAPI') is True and value.get('tokenPublished') is False)

          import json,os,pathlib

          task=pathlib.Path(os.environ['TASK_ROOT'])
          def read(name):
              try:return json.loads((task/name).read_text())
              except BaseException:return None

          def preflight_ok(value):
              if type(value) is not dict or value.get('status')!='passed' or value.get('firstFailure') is not None or value.get('monitorFailure') is not None:return False
              for label,total in (('checkpoint-tests',491),('failure-recording-tests',14)):
                  tests=value.get(label)
                  if not (type(tests) is dict and tests.get('complete') is True and tests.get('status')=='passed' and
                      integer(tests.get('total'),total) and integer(tests.get('skipped'),0)):return False
              stages=value.get('stages')
              return (type(stages) is list and len(stages)>=3 and all(type(row) is dict and integer(row.get('exitCode'),0) and
                  row.get('groupCleanup')=='verified-gone' and row.get('leaderReap')=={'status':'reaped','exitCode':0} and
                  row.get('cleanupFailure') is None for row in stages))

          def driver_ok(value):
              if type(value) is not dict:return False
              if not (integer(value.get('schema'),1) and value.get('status')=='passed' and value.get('contractVerified') is True and
                  value.get('firstFailure') is None and value.get('driverFailure') is None and value.get('monitorFailure') is None and
                  value.get('monitorFailureObserved') is False and value.get('outstandingGroups') is False and
                  value.get('evidenceWriteFailure') is False):return False
              stages=value.get('stages')
              if type(stages) is not list or len(stages)!=1:return False
              row=stages[0];leader=row.get('leaderReap') if type(row) is dict else None
              return (type(row) is dict and row.get('stage')=='build-completion-contract' and integer(row.get('exitCode'),0) and
                  row.get('groupCleanup')=='verified-gone' and row.get('cleanupFailurePresent') is False and
                  type(leader) is dict and leader.get('status')=='reaped' and integer(leader.get('exitCode'),0))

          preflight=preflight_ok(read('monitor-preflight.json'))
          source=source_ok(read('profile-serializer-source.json'))
          contract=contract_ok(read('build-completion-contract-probe/build-completion-contract.json'))
          driver=driver_ok(read('build-completion-contract-driver.json'))
          passed=preflight and source and contract and driver
          print(json.dumps({'status':'passed' if passed else 'failed','monitorPreflightVerified':preflight,
              'officialPinnedSerializerSourceVerified':source,'bothSerializerFormatsAndNegativesVerified':contract,
              'ownedStageReapedAndGroupGone':driver,'qualification':'synthetic-serializer-contract-actual-source',
              'realBuildPerformed':False,'mozillaQualification':False,'resourceQualification':False,
              'sdkAcquired':False,'checkpointDownloaded':False,'newArtifacts':0}),flush=True)
          if not passed:raise SystemExit(1)
          PYCODE
