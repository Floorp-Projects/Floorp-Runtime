# SDKless fixed-upstream serializer contract; no real build or Mozilla qualification.
name: Bounded primitive-column tails on Intel Mac
'on':
  push:
    branches: [codex/mac-native-streaming-recovery55-20261019]
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-intel-checkpoint-${{ github.ref }}
  cancel-in-progress: false
env:
  FLOORP_FIXTURE_SHA: 26b3dba870b43327da6dfd261df61bc96deed402
  HARNESS_SHA: cbe45a7d7480d713b2c40a9ed348420126e6ccb0
  RUNTIME_SHA: 7dd619742b25567e479eeda97ae071d10542ad0b
jobs:
  consumer:
    name: checkpoint-consumer
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
      - name: Bound the initial authorized execution
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Floorp-Projects/Floorp-Runtime
          [[ "$FLOORP_FIXTURE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/codex/mac-native-streaming-recovery55-20261019
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test '${{ github.event.created }}' = true
          test '${{ github.event.before }}' = 0000000000000000000000000000000000000000
          TASK_PYTHON="$RUNNER_TOOL_CACHE/Python/3.12.10/x64/bin/python3"
          test -x "$TASK_PYTHON"
          echo "TASK_PYTHON=$TASK_PYTHON" >> "$GITHUB_ENV"
          echo "TASK_ROOT=$RUNNER_TEMP/floorp-native-checkpoint" >> "$GITHUB_ENV"
      - name: Checkout immutable reviewed fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Floorp-Projects/Floorp
          ref: ${{ env.FLOORP_FIXTURE_SHA }}
          path: fixture
          persist-credentials: false
          fetch-depth: 1
      - name: Establish this job's fresh clock and task root
        timeout-minutes: 3
        env:
          CHECKPOINT_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          "$TASK_PYTHON" fixture/tools/qa/native-nonpgo/checkpoint_transfer.py init --role consumer --task "$TASK_ROOT"
      - name: Verify actual native process monitor before acquisition
        timeout-minutes: 10
        shell: bash
        run: |
          "$TASK_PYTHON" - <<'PYCODE'
          import json,os,pathlib,re,sys
          helper=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'fixture/tools/qa/native-nonpgo'
          sys.path.insert(0,str(helper))
          from support import Runner,clean_environment,require,write_json,Failure
          from darwin_activity import probe
          from unittest_receipt import receipt as unittest_receipt,density_public,DENSITY_ID,DENSITY_METHOD
          from process_census import BINDING_KEYS,prepare_abi,load_abi,snapshot
          def density_input(value):
              try:
                  value=density_public(value)
                  return (value['inputBytes']==195000385 and
                      value['inputSHA256']=='0615e94cd59a7e5da8d98decc2b1a48f74a0415fedda610fd3b67c7cbebae8d7')
              except BaseException:return False

          def density_continuation(qa,records,first_failure,monitor_failure,outstanding):
              if not (type(qa) is dict and qa.get('complete') is True and qa.get('status')=='failed' and
                  all(type(qa.get(k)) is int and qa[k]==n for k,n in
                      (('total',525),('failures',1),('errors',0),('skipped',0)))):return False
              expected={'outcome':'FAIL','test':DENSITY_ID,'phase':DENSITY_METHOD,
                  'frames':[{'file':'test_build_completion.py','line':450}],'exceptionType':'AssertionError'}
              if qa.get('cases')!=[expected]:return False
              diagnostics=qa.get('buildCompletionDensityDiagnostics')
              if type(diagnostics) is not list or len(diagnostics)!=1:return False
              diagnostic=diagnostics[0]
              if not density_input(diagnostic) or diagnostic['status']!='unconfirmed':return False
              if monitor_failure is not None or outstanding is not False:return False
              if not (type(first_failure) is dict and set(first_failure)=={'stage','code','elapsedSeconds'} and
                  first_failure['stage']=='checkpoint-tests' and first_failure['code']=='nonzero-exit' and
                  type(first_failure['elapsedSeconds']) in (int,float) and
                  0<=first_failure['elapsedSeconds']<=900):return False
              if type(records) is not list or len(records)!=3:return False
              for row,(name,code) in zip(records,(('census-abi-compile',0),('census-abi',0),('checkpoint-tests',1))):
                  if not (type(row) is dict and row.get('stage')==name and type(row.get('exitCode')) is int and
                      row['exitCode']==code and row.get('groupCleanup')=='verified-gone' and
                      'cleanupFailure' in row and row['cleanupFailure'] is None and row.get('cleanupDiagnostics')==[] and
                      type(row.get('leaderReap')) is dict and row['leaderReap'].get('status')=='reaped' and
                      type(row['leaderReap'].get('exitCode')) is int and row['leaderReap']['exitCode']==code):return False
              if not all('reason' in row and row['reason'] is None and
                  'failurePhase' in row and row['failurePhase'] is None for row in records[:2]):return False
              return records[-1].get('reason')=='nonzero-exit' and records[-1].get('failurePhase')=='wait'

          def phase_public(value):
              import math
              from unittest_receipt import density_public
              fields={'schema','scope','parserSHA256','instrumentedFunctionSHA256','densityObservation',
                  'marks','lastReachedBoundary','secondPassRowsEntered','realBuildPerformed','runtimeContext'}
              if type(value) is not dict or set(value)!=fields:raise ValueError('phase-shape')
              if not (type(value['schema']) is int and value['schema']==1 and
                  value['scope']=='same-controlled-input-phase-observation' and
                  value['parserSHA256']=='37c17b48e57d910108996878e35445e46405b8afec0a3b20f3eb810db625af83' and
                  value['instrumentedFunctionSHA256']=='db374c6398ee0bbf4dc6a7459442a274aef95fa8006d68591b700bdb7b403041' and
                  value['realBuildPerformed'] is False):raise ValueError('phase-binding')
              context=value['runtimeContext']
              if not (type(context) is dict and set(context)=={'pythonVersion','jsonScanner'} and
                  type(context['pythonVersion']) is list and len(context['pythonVersion'])==3 and
                  all(type(item) is int and 0<=item<=999 for item in context['pythonVersion']) and
                  type(context['jsonScanner']) is str and context['jsonScanner'] in ('c','other')):
                  raise ValueError('phase-runtime-context')
              density=density_public(value['densityObservation'])
              if not (density['inputBytes']==195000385 and
                  density['inputSHA256']=='0615e94cd59a7e5da8d98decc2b1a48f74a0415fedda610fd3b67c7cbebae8d7' and
                  density['status'] in ('observed','unconfirmed') and
                  density['reason']==('build-completion-profile-parsed' if density['status']=='observed' else 'build-completion-processing-limit')):
                  raise ValueError('phase-input')
              phases=('whole-document-validation','profile-schema','string-table','marker-columns')
              marks=value['marks'];rows=value['secondPassRowsEntered']
              if not (type(marks) is list and 1<=len(marks)<=4 and type(rows) is int and 0<=rows<=1000002):
                  raise ValueError('phase-progress')
              previous=0
              for mark,name in zip(marks,phases):
                  if not (type(mark) is dict and set(mark)=={'phase','elapsedSeconds'} and mark['phase']==name and
                      type(mark['elapsedSeconds']) in (int,float) and math.isfinite(mark['elapsedSeconds']) and
                      previous<=mark['elapsedSeconds']<=density['elapsedSeconds']):raise ValueError('phase-order')
                  previous=mark['elapsedSeconds']
              if value['lastReachedBoundary']!=phases[len(marks)-1]:raise ValueError('phase-last')
              if len(marks)<4 and rows!=0:raise ValueError('phase-rows')
              if density['status']=='observed' and (len(marks)!=4 or rows!=1000002):raise ValueError('phase-complete')
              if density['status']=='unconfirmed' and density['elapsedSeconds']<30:raise ValueError('phase-deadline')
              return value
          
          PHASE_PROBE='import ast,hashlib,inspect,json,os,sys,tempfile,time\nfrom pathlib import Path\nimport build_completion as bc\nfrom test_build_completion import marker,phase,whole,NAME\nfrom unittest_receipt import DENSITY_ID,density_public\nfrom support import write_json\nPARSER=\'37c17b48e57d910108996878e35445e46405b8afec0a3b20f3eb810db625af83\'\nPHASES=(\'whole-document-validation\',\'profile-schema\',\'string-table\',\'marker-columns\')\ndef main():\n original=Path(bc.__file__).read_bytes()\n if hashlib.sha256(original).hexdigest()!=PARSER or bc.PROCESSING_SECONDS!=30:\n  raise RuntimeError()\n source=inspect.getsource(bc._whole_stream)\n edits=[\n ("    reader = _JSONStream(", "    _phase(\'whole-document-validation\', completed)\\n    reader = _JSONStream("),\n ("    index = reader.index", "    _phase(\'profile-schema\', completed)\\n    index = reader.index"),\n ("    for value in _array_values(reader.fd, strings, deadline):","    _phase(\'string-table\', completed)\\n    for value in _array_values(reader.fd, strings, deadline):"),\n ("    data_codes = columns[\'data\'].get(\'dataCodes\')", "    _phase(\'marker-columns\', completed)\\n    data_codes = columns[\'data\'].get(\'dataCodes\')")]\n state={\'marks\':[]}\n def enter(name,completed):\n  if name not in PHASES or len(state[\'marks\'])>=4:raise RuntimeError()\n  state[\'currentPhase\']=name;state[\'completed\']=completed\n  state[\'marks\'].append({\'phase\':name,\'elapsedSeconds\':time.monotonic()-state[\'start\']})\n for before,after in edits:\n  if source.count(before)!=1:raise RuntimeError()\n  source=source.replace(before,after)\n namespace=dict(vars(bc));namespace[\'_phase\']=enter\n exec(compile(ast.parse(source),\'<fixed-whole-stream-phase-observer>\',\'exec\'),namespace)\n bc._whole_stream=namespace[\'_whole_stream\']\n resource=marker(\'CPU\',\'unused\')\n resource[\'data\']={\'type\':\'CPU\',\'user\':1.25,\'system\':2.5,\'idle\':97.5,\'cores\':[1.0]*8,\'PRIVATE_SENTINEL\':\'x\'*64}\n raw=json.dumps(whole([phase(),marker(),*([resource]*1000000)]),separators=(\',\',\':\')).encode()\n input_sha=hashlib.sha256(raw).hexdigest()\n if len(raw)!=195000385 or input_sha!=\'0615e94cd59a7e5da8d98decc2b1a48f74a0415fedda610fd3b67c7cbebae8d7\':raise RuntimeError()\n with tempfile.TemporaryDirectory(prefix=\'density-phase-\',dir=os.environ[\'TMPDIR\']) as temporary:\n  task=Path(temporary).resolve();directory=task.joinpath(*bc.PARTS);directory.mkdir(parents=True)\n  snapshot=bc.start_snapshot(task);(directory/NAME).write_bytes(raw)\n  state[\'start\']=time.monotonic();collected=bc.collect(task,snapshot)\n  elapsed=time.monotonic()-state[\'start\']\n  density=density_public({\'schema\':1,\'case\':DENSITY_ID,\'status\':collected[\'status\'],\'reason\':collected[\'reason\'],\n   \'elapsedSeconds\':elapsed,\'inputBytes\':len(raw),\'inputSHA256\':input_sha,\'resourceRows\':1000000,\'processingSeconds\':bc.PROCESSING_SECONDS,\n   \'completeCoverage\':collected[\'completeCoverage\'],\'objectCount\':(collected[\'finishedTargetMarkers\']or{}).get(\'Object\'),\n   \'compileCount\':(collected[\'finishedTierMarkers\']or{}).get(\'compile\')})\n  value={\'schema\':1,\'scope\':\'same-controlled-input-phase-observation\',\'parserSHA256\':PARSER,\n   \'instrumentedFunctionSHA256\':hashlib.sha256(source.encode()).hexdigest(),\'densityObservation\':density,\n   \'marks\':state[\'marks\'],\'lastReachedBoundary\':state.get(\'currentPhase\'),\n   \'secondPassRowsEntered\':state[\'completed\'].rows if \'completed\'in state else None,\'realBuildPerformed\':False,\n   \'runtimeContext\':{\'pythonVersion\':[sys.version_info.major,sys.version_info.minor,sys.version_info.micro],\n    \'jsonScanner\':\'c\' if json.scanner.c_make_scanner is not None and type(bc._DECODER.scan_once) is json.scanner.c_make_scanner else \'other\'}}\n write_json(Path(os.environ[\'TASK_ROOT\'])/\'density-phase-observation.json\',value)\n print(json.dumps({\'densityPhaseObservation\':value}),flush=True)\nif __name__==\'__main__\':\n try:main()\n except BaseException:\n  print(json.dumps({\'densityPhaseProbeFailure\':{\'code\':\'phase-probe-unavailable\'}}),flush=True)\n  raise SystemExit(1)\n\n'

          task=pathlib.Path(os.environ['TASK_ROOT'])
          plan=json.loads((helper/'plan.json').read_text())
          runner=Runner(task,float((task/'started').read_text()),plan['limits'])
          env=clean_environment(task)
          temporary=task/'monitor-tmp'
          temporary.mkdir(mode=0o700)
          env['TMPDIR']=str(temporary)
          env['PYTHONDONTWRITEBYTECODE']='1'
          env['PYTHONWARNINGS']='error::ResourceWarning'
          env['PATH']+=':/usr/local/bin'
          result={'status':'failed','diagnosticContinuation':False}
          primary_error=None
          phase='self-probe'
          try:
              own=probe().read(os.getpid(),os.getpgrp())
              require(own['status']=='measured' and own['rssMiB']>0,'monitor-native-self-unavailable')
              result['self']={key:own[key] for key in ('status','rssMiB','cpuSeconds','state')}
              phase='abi'
              abi=prepare_abi(task,runner,env)
              os.environ['FLOORP_CENSUS_ABI']=str(abi)
              env.update({key:os.environ[key] for key in (*BINDING_KEYS,'TASK_ROOT')})
              env['FLOORP_CENSUS_ABI']=str(abi)
              phase='identity-snapshot'
              result['census']=snapshot(load_abi(abi))['measurement']
              with pathlib.Path(os.environ['GITHUB_ENV']).open('a') as output:
                  output.write('FLOORP_CENSUS_ABI='+str(abi)+'\n')
              if True:
                  suites=[('checkpoint-tests',[sys.executable,'-m','unittest','-v',
                      'test_checkpoint','test_process_census','test_guards','test_shim_failure_patch',
                      'test_completion_preflight','test_unittest_receipt','test_qa_core',
                      'test_darwin_inventory','test_inventory_timeout','test_helper_import_preflight',
                      'test_checkpoint_transfer','test_checkpoint_replay','test_failure_excerpt',
                      'test_pipeline_restore','test_checkpoint_restore_replay','test_checkpoint_public',
                      'test_mozilla_harness_receipt','test_mozilla_harness_smoke',
                      'test_sdk_source','test_sdk_source_integration','test_consumer_time',
                      'test_build_completion','test_build_completion_contract'],525,False),
                      ('failure-recording-tests',[sys.executable,'-m','unittest','discover','-v',
                      '-s',str(helper.parents[1]/'app-shim'),'-p','test_shim_failure_diagnostics.py'],14,True)]
                  for test_stage,command,expected,recording in suites:
                      phase=test_stage
                      stage_error=None
                      try:
                          runner.run(test_stage,command,helper,env,360,phase_deadline_minutes=15)
                      except Failure as error:
                          stage_error=error
                      finally:
                          result[test_stage]=unittest_receipt(task/(test_stage+'.private.log'),recording=recording)
                      tests=result[test_stage]
                      if stage_error is not None:
                          if not (test_stage=='checkpoint-tests' and str(stage_error)=='nonzero-exit' and
                              density_continuation(tests,runner.records,runner.failure,runner.monitor_failure,bool(runner.groups))):
                              raise stage_error
                          result['diagnosticContinuation']=True
                          continue
                      require(tests['complete'] and tests['status']=='passed' and
                              tests['total']==expected and tests['skipped']==0,'checkpoint-mac-tests')
                      if test_stage=='checkpoint-tests':
                          controls=tests.get('buildCompletionDensityDiagnostics')
                          require(type(controls) is list and len(controls)==1 and density_input(controls[0]) and
                              controls[0]['status']=='observed','checkpoint-density-observation')
              phase='owned-monitor-control'
              script="import subprocess; [subprocess.run(['/bin/sh','-c','/bin/sleep 0.1'],check=True) for _ in range(20)]"
              runner.run('monitor-preflight',[sys.executable,'-c',script],task,env,360,phase_deadline_minutes=15)
              require(any(row['stage']=='monitor-preflight' and (row['lastActivity'] or {}).get('sampleComplete') is True and
                          (row['lastActivity'] or {}).get('counterSource')=='libproc-taskallinfo' for row in runner.records),
                      'monitor-preflight-no-complete-sample')
              phase='density-phase-observation'
              runner.run('density-phase-observation',[sys.executable,'-c',PHASE_PROBE],helper,env,360,phase_deadline_minutes=15)
              try:
                  observed=json.loads((task/'density-phase-observation.json').read_text())
                  result['densityPhaseObservation']=phase_public(observed)
              except BaseException:
                  raise Failure('density-phase-evidence-invalid') from None
              result['status']='failed' if result['diagnosticContinuation'] else 'passed'
          except BaseException as error:
              primary_error=error
              result.update(status='failed',failurePhase=phase)
              runner.fail('monitor-preflight','checkpoint-preflight-failure')
              raise
          finally:
              result.update(stages=runner.records,monitorFailure=runner.monitor_failure,
                            monitorDiagnostics=runner.monitor_diagnostics,firstFailure=runner.failure)
              evidence_error=False
              try:
                  write_json(task/'monitor-preflight.json',result)
              except OSError:
                  evidence_error=True
                  runner.fail('preflight-evidence','checkpoint-preflight-evidence-write')
                  result.update(status='failed',evidenceWriteFailure=True,firstFailure=runner.failure)
              print(json.dumps({'monitorPreflight':result}),flush=True)
              if evidence_error and primary_error is None:
                  require(False,'checkpoint-preflight-evidence-write')
          PYCODE
      - name: Fetch only the immutable upstream serializer source
        timeout-minutes: 3
        env:
          PROFILE_SOURCE_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          "$TASK_PYTHON" - <<'PYCODE'
          import hashlib,json,os,pathlib,time,urllib.request
          from urllib.error import HTTPError,URLError

          task=pathlib.Path(os.environ['TASK_ROOT'])
          result={'schema':1,'status':'failed','runtimeRef':'7dd619742b25567e479eeda97ae071d10542ad0b',
                  'bytes':None,'sha256':None,'officialContentsAPI':True,'tokenPublished':False}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  raise RuntimeError('redirect-rejected')
          try:
              started=time.monotonic()
              url=('https://api.github.com/repos/Floorp-Projects/Floorp-Runtime/contents/'
                   'testing/mozbase/mozsystemmonitor/mozsystemmonitor/resourcemonitor.py'
                   '?ref=7dd619742b25567e479eeda97ae071d10542ad0b')
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['PROFILE_SOURCE_READ_TOKEN'],
                  'Accept':'application/vnd.github.raw+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.build_opener(NoRedirect).open(request,timeout=30) as response:
                  if response.status!=200:raise RuntimeError('status')
                  raw=response.read(1024**2+1)
              if time.monotonic()-started>90 or len(raw)!=126050:raise RuntimeError('size-or-deadline')
              sha=hashlib.sha256(raw).hexdigest()
              if sha!='5f2f9572658fc19d342b5e56904ce110eeb258ff57c4e5d8614a8b0b5b7d1eaf':raise RuntimeError('hash')
              destination=task/'profile-serializer-source'
              destination.mkdir(mode=0o700,exist_ok=False)
              with (destination/'resourcemonitor.py').open('xb') as output:
                  os.fchmod(output.fileno(),0o600);output.write(raw)
              result.update(status='passed',bytes=len(raw),sha256=sha)
          except BaseException:
              result['code']='fixed-profile-source-acquisition-failed'
          finally:
              try:
                  receipt=task/'profile-serializer-source.json'
                  receipt.write_text(json.dumps(result,sort_keys=True)+'\n');receipt.chmod(0o600)
              except BaseException:
                  result.update(status='failed',code='fixed-profile-source-evidence-write-failed')
              finally:
                  print(json.dumps({'upstreamSerializerSourceAcquisition':result}),flush=True)
          if result['status']!='passed':raise SystemExit(1)
          PYCODE
      - name: Observe the actual serializer contract in an owned monitored stage
        timeout-minutes: 15
        shell: bash
        run: |
          "$TASK_PYTHON" - <<'PYCODE'
          def integer(value,expected):
              return type(value) is int and value==expected

          def contract_ok(value):
              if type(value) is not dict:return False
              fixed={'schema','status','qualification','runtimeRef','sourceSHA256','sourceBytes',
                  'actualSerializerSourceVerified','serializerBackend','syntheticClockAndMarkers',
                  'resourceSamplesCollected','workerStarted','realBuildPerformed','mozillaQualification',
                  'fullBuildQualification','resourceQualification','bothFormatsObserved',
                  'negativeInputsDidNotConfirmTargets','cases','firstFailure','taskCreated','receiptWriteFailure',
                  'largeWholeRequested','largeWholeObserved'}
              if set(value)!=fixed:return False
              if not (integer(value.get('schema'),1) and integer(value.get('sourceBytes'),126050) and
                  value.get('status')=='observed-both-formats' and
                  value.get('qualification')=='synthetic-serializer-contract-actual-source' and
                  value.get('runtimeRef')=='7dd619742b25567e479eeda97ae071d10542ad0b' and
                  value.get('sourceSHA256')=='5f2f9572658fc19d342b5e56904ce110eeb258ff57c4e5d8614a8b0b5b7d1eaf' and
                  value.get('serializerBackend')=='upstream-PsutilStub' and
                  all(value.get(k) is True for k in ('actualSerializerSourceVerified','syntheticClockAndMarkers',
                      'bothFormatsObserved','negativeInputsDidNotConfirmTargets','taskCreated',
                      'largeWholeRequested','largeWholeObserved')) and
                  all(value.get(k) is False for k in ('resourceSamplesCollected','workerStarted','realBuildPerformed',
                      'mozillaQualification','fullBuildQualification','resourceQualification')) and
                  value.get('firstFailure') is None and value.get('receiptWriteFailure') is None):return False
              cases=value.get('cases')
              if type(cases) is not list or len(cases)!=9:return False
              expected=[(f,c,False) for f in ('jsonl','whole-profile') for c in ('positive','no-end','truncated')]
              expected += [('whole-profile',c,True) for c in ('positive','no-end','truncated')]
              for row,(profile_format,control,large) in zip(cases,expected):
                  if type(row) is not dict or set(row)!={'format','control','cleanup','observation','expectationSatisfied','largeProfile','inputBytes'}:return False
                  if row.get('format')!=profile_format or row.get('control')!=control or row.get('expectationSatisfied') is not True:return False
                  if row.get('largeProfile') is not large or type(row.get('inputBytes')) is not int:return False
                  if not 0 < row['inputBytes'] <= 2*1024**3 or (large and row['inputBytes'] <= 16*1024**2):return False
                  cleanup=row.get('cleanup')
                  keys={'streamClosed','parentPipeClosed','childPipeClosed','processClosed','workerNeverStarted','failures'}
                  if type(cleanup) is not dict or set(cleanup)!=keys or cleanup.get('failures')!=[]:return False
                  if not all(cleanup.get(k) is True for k in keys-{'failures'}):return False
                  observed=row.get('observation')
                  if type(observed) is not dict or set(observed)!={'status','profileFormat','completeCoverage','lastFinishedTier',
                      'targets','finishedTargetCounts','provesBuildCompletion','provesCacheHit'}:return False
                  if observed.get('provesBuildCompletion') is not False or observed.get('provesCacheHit') is not False:return False
                  targets=observed.get('targets');counts=observed.get('finishedTargetCounts');last=observed.get('lastFinishedTier')
                  if type(targets) is not dict or set(targets)!={'XUL','xpcshell'}:return False
                  if type(counts) is not dict or set(counts)!={'SharedLib','Program'}:return False
                  if type(last) is not dict or set(last)!={'tier','endTimeMs'}:return False
                  for target in targets.values():
                      if type(target) is not dict or set(target)!={'status','endTimeMs'}:return False
                  if control=='positive':
                      if not (observed.get('status')=='observed' and observed.get('profileFormat')==profile_format and
                          observed.get('completeCoverage') is True and last=={'tier':'compile','endTimeMs':40000.0} and
                          targets=={'XUL':{'status':'observed-finished','endTimeMs':35000.0},
                                   'xpcshell':{'status':'observed-finished','endTimeMs':30000.0}} and
                          all(integer(counts[k],2) for k in counts)):return False
                  else:
                      if last!={'tier':None,'endTimeMs':None}:return False
                      if any(t!={'status':'unconfirmed','endTimeMs':None} for t in targets.values()):return False
                      if control=='no-end':
                          if not (observed.get('status')=='observed' and observed.get('profileFormat')==profile_format and
                              observed.get('completeCoverage') is True and all(integer(counts[k],0) for k in counts)):return False
                      elif not (observed.get('status')=='unconfirmed' and observed.get('profileFormat') is None and
