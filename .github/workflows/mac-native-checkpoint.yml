        CASE_SPECS=(('compiled-debug','positive',0,'passed'),('failure-control','negative-control',1,'failed'),('upstream-version-comparator','positive',0,'passed'))\n\
        def boolean(value):return value if type(value) is bool else None\ndef safe_stage(value):return value if\
        \ type(value) is str and value in KNOWN_STAGES else 'other'\ndef failure_safe(value):\n    result=runner_failure(value)\n\
