name: Guarded existing checkpoint Firefox target graph observation
'on':
  push:
    branches:
    - codex/mac-native-firefox-graph-recovery56-20261019
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-intel-checkpoint-${{ github.ref }}
  cancel-in-progress: false
env:
  FLOORP_FIXTURE_SHA: 5be48e693474744f8f87ba31aff3c591bb182bec
  HARNESS_SHA: cbe45a7d7480d713b2c40a9ed348420126e6ccb0
  RUNTIME_SHA: 7dd619742b25567e479eeda97ae071d10542ad0b
  SDK_SOURCE_SHA256: ef5d0ed40f4f27b919df7a46323c63b7790ba325ce288a873b207858614bd688
jobs:
  consumer:
    name: checkpoint-consumer
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
    - name: Bound the initial authorized execution
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Floorp-Projects/Floorp-Runtime
        [[ "$FLOORP_FIXTURE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$SDK_SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
        test "$GITHUB_REF" = refs/heads/codex/mac-native-firefox-graph-recovery56-20261019
        test "$GITHUB_EVENT_NAME" = push
        test "$GITHUB_RUN_ATTEMPT" = 1
        test '${{ github.event.created }}' = true
        test '${{ github.event.before }}' = 0000000000000000000000000000000000000000
        TASK_PYTHON="$RUNNER_TOOL_CACHE/Python/3.12.10/x64/bin/python3"
        test -x "$TASK_PYTHON"
        echo "TASK_PYTHON=$TASK_PYTHON" >> "$GITHUB_ENV"
        echo "TASK_ROOT=$RUNNER_TEMP/floorp-native-checkpoint" >> "$GITHUB_ENV"
    - name: Checkout immutable reviewed fixture
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: Floorp-Projects/Floorp
        ref: ${{ env.FLOORP_FIXTURE_SHA }}
        path: fixture
        persist-credentials: false
        fetch-depth: 1
    - name: Establish this job's fresh clock and task root
      timeout-minutes: 3
      env:
        CHECKPOINT_READ_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        "$TASK_PYTHON" fixture/tools/qa/native-nonpgo/checkpoint_transfer.py init --role consumer --task "$TASK_ROOT"
    - name: Verify actual native process monitor before acquisition
      timeout-minutes: 10
      shell: bash
      run: |
        "$TASK_PYTHON" - > "$TASK_ROOT/monitor-preflight-driver.private.log" 2>&1 <<'PYCODE'
        import json,os,pathlib,re,sys
        helper=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'fixture/tools/qa/native-nonpgo'
        sys.path.insert(0,str(helper))
        from support import Runner,clean_environment,require,write_json
        from darwin_activity import probe
        from unittest_receipt import receipt as unittest_receipt
        from process_census import BINDING_KEYS,prepare_abi,load_abi,snapshot
        task=pathlib.Path(os.environ['TASK_ROOT'])
        plan=json.loads((helper/'plan.json').read_text())
        runner=Runner(task,float((task/'started').read_text()),plan['limits'])
        env=clean_environment(task)
        temporary=task/'monitor-tmp'
        temporary.mkdir(mode=0o700)
        env['TMPDIR']=str(temporary)
        env['PYTHONDONTWRITEBYTECODE']='1'
        env['PYTHONWARNINGS']='error::ResourceWarning'
        env['PATH']+=':/usr/local/bin'
        result={'status':'failed'}
        primary_error=None
        phase='self-probe'
        try:
            own=probe().read(os.getpid(),os.getpgrp())
            require(own['status']=='measured' and own['rssMiB']>0,'monitor-native-self-unavailable')
            result['self']={key:own[key] for key in ('status','rssMiB','cpuSeconds','state')}
            phase='abi'
            abi=prepare_abi(task,runner,env)
            os.environ['FLOORP_CENSUS_ABI']=str(abi)
            env.update({key:os.environ[key] for key in (*BINDING_KEYS,'TASK_ROOT')})
            env['FLOORP_CENSUS_ABI']=str(abi)
            phase='identity-snapshot'
            result['census']=snapshot(load_abi(abi))['measurement']
            with pathlib.Path(os.environ['GITHUB_ENV']).open('a') as output:
                output.write('FLOORP_CENSUS_ABI='+str(abi)+'\n')
            if True:
                suites=[('checkpoint-tests',[sys.executable,'-m','unittest','-v',
                    'test_checkpoint','test_process_census','test_guards','test_shim_failure_patch',
                    'test_completion_preflight','test_unittest_receipt','test_qa_core',
                    'test_darwin_inventory','test_inventory_timeout','test_helper_import_preflight',
                    'test_checkpoint_transfer','test_checkpoint_replay','test_failure_excerpt',
                    'test_pipeline_restore','test_checkpoint_restore_replay','test_checkpoint_public',
                    'test_mozilla_harness_receipt','test_mozilla_harness_smoke',
                    'test_sdk_source','test_sdk_source_integration','test_consumer_time',
                    'test_build_completion','test_build_completion_contract'],529,False),
                    ('failure-recording-tests',[sys.executable,'-m','unittest','discover','-v',
                    '-s',str(helper.parents[1]/'app-shim'),'-p','test_shim_failure_diagnostics.py'],14,True)]
                for test_stage,command,expected,recording in suites:
                    phase=test_stage
                    try:
                        runner.run(test_stage,command,helper,env,360,phase_deadline_minutes=15)
                    finally:
                        result[test_stage]=unittest_receipt(task/(test_stage+'.private.log'),recording=recording)
                    tests=result[test_stage]
                    require(tests['complete'] and tests['status']=='passed' and
                            tests['total']==expected and tests['skipped']==0,'checkpoint-mac-tests')
            phase='owned-monitor-control'
            script="import subprocess; [subprocess.run(['/bin/sh','-c','/bin/sleep 0.1'],check=True) for _ in range(20)]"
            runner.run('monitor-preflight',[sys.executable,'-c',script],task,env,360,phase_deadline_minutes=15)
            require(any(row['stage']=='monitor-preflight' and (row['lastActivity'] or {}).get('sampleComplete') is True and
                        (row['lastActivity'] or {}).get('counterSource')=='libproc-taskallinfo' for row in runner.records),
                    'monitor-preflight-no-complete-sample')
            result['status']='passed'
        except BaseException as error:
            primary_error=error
            result.update(status='failed',failurePhase=phase)
            runner.fail('monitor-preflight','checkpoint-preflight-failure')
            raise
        finally:
            result.update(stages=runner.records,monitorFailure=runner.monitor_failure,
                          monitorDiagnostics=runner.monitor_diagnostics,firstFailure=runner.failure)
            evidence_error=False
            try:
                write_json(task/'monitor-preflight.json',result)
            except OSError:
                evidence_error=True
                runner.fail('preflight-evidence','checkpoint-preflight-evidence-write')
                result.update(status='failed',evidenceWriteFailure=True,firstFailure=runner.failure)
            print(json.dumps({'monitorPreflight':result}),flush=True)
            if evidence_error and primary_error is None:
                require(False,'checkpoint-preflight-evidence-write')
        PYCODE
    - name: Acquire the official unexpired renewed content-matched SDK
      timeout-minutes: 12
      env:
        SDK_READ_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        "$TASK_PYTHON" - <<'PYCODE'
        import hashlib,os,pathlib
        path=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'fixture/tools/qa/native-nonpgo/sdk_source.json'
        raw=path.read_bytes()
        if len(raw)>65536 or hashlib.sha256(raw).hexdigest()!=os.environ['SDK_SOURCE_SHA256']:
            raise SystemExit('sdk-source-pin-mismatch')
        PYCODE
        "$TASK_PYTHON" fixture/tools/qa/native-nonpgo/fetch_sdk.py --plan fixture/tools/qa/native-nonpgo/plan.json --sdk-source fixture/tools/qa/native-nonpgo/sdk_source.json --output "$TASK_ROOT/sdk-download"
    - name: Checkout immutable Runtime source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ env.RUNTIME_SHA }}
        path: source
        persist-credentials: false
        fetch-depth: 1
        submodules: false
    - name: Checkout immutable native harness
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: Floorp-Projects/Floorp
        ref: ${{ env.HARNESS_SHA }}
        path: harness
        persist-credentials: false
        fetch-depth: 1
        sparse-checkout: tools/app-shim
    - name: Download only the verified successful producer checkpoint
      timeout-minutes: 25
      env:
        CHECKPOINT_READ_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        "$TASK_PYTHON" fixture/tools/qa/native-nonpgo/checkpoint_transfer.py fetch --role consumer --task "$TASK_ROOT" --replay-origin
    - name: Restore only the verified original checkpoint with all existing guards
      id: pipeline
      env:
        CHECKPOINT_BUILD_DATE: '20261019035607'
      shell: bash
      run: |
        "$TASK_PYTHON" fixture/tools/qa/native-nonpgo/pipeline.py --source "$GITHUB_WORKSPACE/source" --fixture "$GITHUB_WORKSPACE/fixture" --harness "$GITHUB_WORKSPACE/harness" --task "$TASK_ROOT" --checkpoint-role consumer --replay-origin --restore-only --sdk-source fixture/tools/qa/native-nonpgo/sdk_source.json > "$TASK_ROOT/restore-pipeline.private.log" 2>&1
    - name: Read the fixed generated graph in an owned monitored stage
      env:
        GUARDED_RESTORE_OUTCOME: ${{ steps.pipeline.outcome }}
      shell: bash
      run: |
        "$TASK_PYTHON" - > "$TASK_ROOT/firefox-target-driver.private.log" 2>&1 <<'PYCODE'
        """Unintegrated fixed-purpose guarded-restore graph caller code; no acquisition."""
        import hashlib,json,math,os,stat,time,types
        from pathlib import Path
        QA_COUNT = 529
        SDK_SOURCE_SHA = 'ef5d0ed40f4f27b919df7a46323c63b7790ba325ce288a873b207858614bd688'
        PLAN_SHA = '33fb00c07a7ad9f66950489f06c0b5039ee173bc78297bc13b39265b24f4d460'
        RUNTIME_SHA = '7dd619742b25567e479eeda97ae071d10542ad0b'
        PINS = {
         'firefox_target_graph.py': (10361,'ffe2376b84a1e405255a41573d891fb1ad11f0a6d492630b5e4560b661f5be0a'),
         'firefox_target_observer.py': (22432,'fa9be7ee8852b1a3af1f2f6a52a4e271a38630e93507cb8f4b68da2728b014fb')}
        class Unconfirmed(Exception):pass

        def need(value,code):
         if not value:raise Unconfirmed(code)

        def integer(value,expected):return type(value) is int and value==expected

        def identity(value):
         return tuple(getattr(value,key) for key in ('st_dev','st_ino','st_uid','st_mode','st_nlink','st_size','st_mtime_ns','st_ctime_ns'))

        def read_fixed(path,cap):
         path=Path(path)
         need(path.is_absolute() and path.resolve()==path,'binding')
         directory=path.parent.stat();before=path.lstat()
         need(stat.S_ISDIR(directory.st_mode) and directory.st_uid==os.geteuid() and
          stat.S_ISREG(before.st_mode) and before.st_uid==os.geteuid() and before.st_nlink==1 and 0<=before.st_size<=cap,'binding')
         fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|getattr(os,'O_NONBLOCK',0)|getattr(os,'O_CLOEXEC',0))
         try:
          need(identity(before)==identity(os.fstat(fd)),'binding')
          blocks=[];count=0
          while True:
           data=os.read(fd,min(131072,cap-count+1))
           if not data:break
           blocks.append(data);count+=len(data);need(count<=cap,'binding')
          need(count==before.st_size and identity(before)==identity(os.fstat(fd))==identity(path.lstat()) and
           identity(directory)==identity(path.parent.stat()),'binding')
          return b''.join(blocks)
         finally:os.close(fd)

        def decode(raw):
         def pairs(items):
          out={}
          for key,value in items:
           need(key not in out,'receipt');out[key]=value
          return out
         return json.loads(raw,object_pairs_hook=pairs,parse_constant=lambda _:need(False,'receipt'))

        def load_helpers(helper):
         helper=Path(helper)
         raw={}
         for name,(size,sha) in PINS.items():
          data=read_fixed(helper/name,size)
          need(len(data)==size and hashlib.sha256(data).hexdigest()==sha,'helper-pin')
          raw[name]=data
         modules=[]
         for name in PINS:
          module=types.ModuleType(name[:-3])
          # Execute the verified bytes, rather than reopening a pathname during import.
          exec(compile(raw[name],name,'exec'),module.__dict__)
          modules.append(module)
         return tuple(modules)

        def preflight_ok(value):
         if type(value) is not dict or value.get('status')!='passed' or not all(k in value and value[k] is None for k in ('firstFailure','monitorFailure')):return False
         for label,count in (('checkpoint-tests',QA_COUNT),('failure-recording-tests',14)):
          row=value.get(label)
          if not (type(count) is int and type(row) is dict and row.get('complete') is True and row.get('status')=='passed' and
           integer(row.get('total'),count) and all(integer(row.get(key),0) for key in ('failures','errors','skipped'))):return False
         return True

        def sdk_ok(value):
         if type(value) is not dict:return False
         sdk=value.get('sdk');acquired=sdk.get('acquisitionSource') if type(sdk) is dict else None
         if type(sdk) is not dict or type(acquired) is not dict:return False
         return (value.get('planSHA256')==PLAN_SHA and 'sdkEvidenceError' not in value and
          integer(sdk.get('artifact'),12182302735) and integer(sdk.get('sourceRun'),39244172146) and integer(sdk.get('attempt'),1) and
          sdk.get('zipSHA256')=='c2b125f6cba2e98aa6515d772b2300e458be8cc4236bf33028cd633ceb6624ee' and
          sdk.get('tarSHA256')=='a190b3eee16abf546611a18c033c09ecc9e6bbb9b32ad83bb2c68f772ef95b6b' and
          sdk.get('baselineTarSHA256')=='2002b346bf7087cc14f7b0e52bfc25ed767af29461ae1106356feaaec841dcc4' and
          sdk.get('canonicalSHA256')=='c3c01387c82e9ce1436fd517ec19308416663cc526c39be15f66f6bab22c3a5f' and
          set(acquired)=={'qualification','sourceSHA256','baselinePlanSHA256','uncompressedTar','producerJob'} and
          acquired.get('qualification')=='official-artifact-identical-uncompressed-tar-v1' and acquired.get('sourceSHA256')==SDK_SOURCE_SHA and
          type(SDK_SOURCE_SHA) is str and len(SDK_SOURCE_SHA)==64 and acquired.get('baselinePlanSHA256')==PLAN_SHA and
          integer(acquired.get('producerJob'),118032017226) and type(acquired.get('uncompressedTar')) is dict and
          set(acquired['uncompressedTar'])=={'bytes','sha256'} and integer(acquired['uncompressedTar'].get('bytes'),760518144) and
          acquired['uncompressedTar'].get('sha256')=='57aeb200890ba97c382bf450f23f9dab3e0d4696fdf02323a705f82210b087e3')

        def restore_ok(value,context,observer,pipeline_outcome):
         try:
          need(pipeline_outcome=='success','restore')
          observer._restore_consistent(value,context)
          need(value.get('qualification')=='verified-origin-checkpoint-restore-only' and value.get('checkpointRole')=='consumer' and
           all(value.get(key) is False for key in ('productQualification','freshObjdir','sameJob','retry')) and integer(value.get('newArtifacts'),0) and
           'executionTimeBudget' not in value and 'mozilla' not in value and value.get('mozillaFirst') is not True and
           preflight_ok(value.get('monitorPreflight')) and sdk_ok(value) and
           observer._same_json(value.get('checkpointReplayContext'),context) and type(value.get('harness')) is dict and
           type(value.get('toolchains')) is list and len(value['toolchains'])==11,'restore')
          return True
         except BaseException:return False

        def origin_ok(task,now=None):
         value=float(read_fixed(Path(task)/'started-monotonic',4096));now=time.monotonic() if now is None else now
         need(math.isfinite(value) and value<=now<value+3600,'clock')
         return value

        def receipts(task):
         raw={name:read_fixed(Path(task)/name,2*1024**2 if name!='started-monotonic' else 4096)
          for name in ('summary.json','checkpoint-replay-context.json','started-monotonic')}
         return decode(raw['summary.json']),decode(raw['checkpoint-replay-context.json']),{
          label:hashlib.sha256(raw[name]).hexdigest() for label,name in
          (('summary','summary.json'),('context','checkpoint-replay-context.json'),('clock','started-monotonic'))}

        def receipt_binding(before,after,observation):
         if before!=after:return False
         rows=observation['files']
         values=[rows.get(label,{}).get('sha256') for label in before]
         if any(value is None for value in values):return None
         return all(value==sha for value,sha in zip(values,before.values()))

        def observation_safe(value,observer):
         fields={'schema','status','reason','failurePhase','files','graph','restoreReceiptConsistent','restoredConfigStillMatches',
          'configConsistency','bindingsStable','bindingScope','bundleSpec','existingGuardsReexecuted','cleanupFailure',
          'processingLimitSeconds','absoluteRestoreDeadlineMinutes','clockResetAllowed','makeOrRecipeExecuted',
          'minimalSufficientSuffixEstablished','fullHostQualification','realBuildPerformed','durationToCompletion'}
         need(type(value) is dict and set(value)==fields and integer(value.get('schema'),1) and value.get('status') in ('observed','unconfirmed'),'observation')
         need(value.get('reason') is None or value['reason'] in observer.REASONS,'observation')
         need(value.get('failurePhase') in (None,'guard','read','restore-consistency','config-consistency','bundle','graph','binding','cleanup'),'observation')
         need(value.get('bindingScope')=='opened-fds-and-observed-fixed-entries-only' and integer(value.get('processingLimitSeconds'),30) and
          integer(value.get('absoluteRestoreDeadlineMinutes'),60) and value.get('durationToCompletion')=='UNKNOWN' and
          all(value.get(k) is False for k in ('existingGuardsReexecuted','clockResetAllowed','makeOrRecipeExecuted',
          'minimalSufficientSuffixEstablished','fullHostQualification','realBuildPerformed')),'observation')
         for key in ('restoreReceiptConsistent','restoredConfigStillMatches','bindingsStable'):
          need(value.get(key) is None or type(value[key]) is bool,'observation')
         need((value.get('configConsistency')=='matched' and value.get('restoredConfigStillMatches') is True) or
          (value.get('configConsistency')=='unconfirmed' and value.get('restoredConfigStillMatches') is None),'observation')
         files=value.get('files');need(type(files) is dict and set(files)<=({row[0] for row in observer.FIXED}|{'bundleSpec'}),'observation')
         for row in files.values():
          need(type(row) is dict and set(row)=={'status','reason','bytes','sha256','lineCount'} and row.get('status') in ('observed','unconfirmed') and
           (row.get('reason') is None or row['reason'] in observer.REASONS),'observation')
          for key in ('bytes','lineCount'):need(row[key] is None or (type(row[key]) is int and 0<=row[key]<=64*1024**2),'observation')
          need(row['sha256'] is None or (type(row['sha256']) is str and len(row['sha256'])==64 and all(c in '0123456789abcdef' for c in row['sha256'])),'observation')
         bundle=value['bundleSpec']
         if bundle is not None:
          need(type(bundle) is dict and set(bundle)=={'configuredBundleBinding','ownedStageBinding','binariesCount','extra_filesCount','movesCount','copiesCount'},'observation')
          for key in ('configuredBundleBinding','ownedStageBinding'):need(bundle[key] is None or type(bundle[key]) is bool,'observation')
          for key in ('binariesCount','extra_filesCount','movesCount','copiesCount'):need(bundle[key] is None or (type(bundle[key]) is int and 0<=bundle[key]<=1024**2),'observation')
         cleanup=value['cleanupFailure']
         if cleanup is not None:
          need(type(cleanup) is dict and set(cleanup)=={'operation','kind','errno'} and cleanup['operation']=='close-owned-fds' and
           cleanup['kind'] in ('os-error','exception') and (cleanup['errno'] is None or type(cleanup['errno']) is int),'observation')
         if value['graph'] is not None:
          try:observer._graph_safe(value['graph'])
          except BaseException:need(False,'observation')
         if value['status']=='observed':
          need(value['graph'] is not None and value['graph']['status']=='observed' and value['bindingsStable'] is True and
           value['restoreReceiptConsistent'] is True and value['cleanupFailure'] is None and value['reason'] is None and value['failurePhase'] is None,'observation')
         else:need(value['graph'] is None,'observation')
         return value

        def stage_ok(row):
         leader=row.get('leaderReap') if type(row) is dict else None
         return (type(row) is dict and row.get('stage')=='firefox-target-observer' and integer(row.get('exitCode'),0) and
          all(k in row and row[k] is None for k in ('reason','failurePhase','cleanupFailure')) and
          row.get('groupCleanup')=='verified-gone' and type(leader) is dict and leader.get('status')=='reaped' and integer(leader.get('exitCode'),0))

        def safe_error(error,phase):
         return {'phase':phase if phase in ('helpers','restore','clock','environment','observe','binding','observation','cleanup','receipt') else 'unconfirmed',
          'code':error.args[0] if type(error) is Unconfirmed and error.args and error.args[0] in ('binding','receipt','helper-pin','restore','clock','observation','cleanup') else 'driver-failed',
          'kind':'os-error' if isinstance(error,OSError) else 'exception',
          'errno':error.errno if isinstance(error,OSError) and type(error.errno) is int else None}

        def persisted_primary(task,project):
         result={'status':'unconfirmed','failure':None,'observerStage':None}
         try:
          value=decode(read_fixed(Path(task)/'first-failure.json',65536))
          need(type(value) is dict and type(value.get('stage')) is str and type(value.get('code')) is str and
           type(value.get('elapsedSeconds')) in (int,float) and math.isfinite(value['elapsedSeconds']) and value['elapsedSeconds']>=0,'receipt')
          failure=project(value);need(type(failure) is dict,'receipt')
          observer=value['stage']=='firefox-target-observer'
          if observer:failure['stage']='firefox-target-observer'
          return {'status':'observed','failure':failure,'observerStage':observer}
         except FileNotFoundError:result['status']='absent'
         except BaseException:pass
         return result

        CHILD = r'''
        import hashlib,json,os,stat,types
        from pathlib import Path
        PINS = {'firefox_target_graph.py':(10361,'ffe2376b84a1e405255a41573d891fb1ad11f0a6d492630b5e4560b661f5be0a'),
         'firefox_target_observer.py':(22432,'fa9be7ee8852b1a3af1f2f6a52a4e271a38630e93507cb8f4b68da2728b014fb')}
        def ident(s):return tuple(getattr(s,k) for k in ('st_dev','st_ino','st_uid','st_mode','st_nlink','st_size','st_mtime_ns','st_ctime_ns'))
        def load(helper,name):
         size,sha=PINS[name];p=helper/name;s=p.lstat();d=helper.stat()
         if p.resolve()!=p or not stat.S_ISREG(s.st_mode) or s.st_uid!=os.geteuid() or s.st_nlink!=1 or s.st_size!=size:raise ValueError()
         fd=os.open(p,os.O_RDONLY|os.O_NOFOLLOW|getattr(os,'O_NONBLOCK',0))
         try:
          if ident(s)!=ident(os.fstat(fd)):raise ValueError()
          raw=b''
          while len(raw)<=size:
           part=os.read(fd,min(131072,size+1-len(raw)))
           if not part:break
           raw+=part
          if len(raw)!=size or hashlib.sha256(raw).hexdigest()!=sha or ident(s)!=ident(os.fstat(fd)) or ident(s)!=ident(p.lstat()) or ident(d)!=ident(helper.stat()):raise ValueError()
         finally:os.close(fd)
         m=types.ModuleType(name[:-3]);exec(compile(raw,name,'exec'),m.__dict__);return m
        result={'schema':1,'procedureCompleted':False,'observation':None,'firstFailure':None,'receiptWriteFailure':False}
        phase='helpers'
        try:
         task=Path(os.environ['TASK_ROOT']);helper=Path(os.environ['FIREFOX_TARGET_HELPER'])
         pure=load(helper,'firefox_target_graph.py');observer=load(helper,'firefox_target_observer.py')
         phase='restore'
         if os.environ.get('FIREFOX_RESTORE_VERIFIED')!='1':raise ValueError()
         phase='observe';result['observation']=observer.observe_restored_task(task,pure.target_graph_proof,restore_guards_succeeded=True)
         result['procedureCompleted']=True
        except BaseException as error:
