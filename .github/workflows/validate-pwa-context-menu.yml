name: Validate native PWA context menus

"on":
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Runtime run with successful native macOS verification
        required: true
        type: string
      artifact_id:
        description: Exact macOS Universal Actions artifact ID
        required: true
        type: string
      artifact_digest:
        description: Exact SHA-256 of the Actions artifact ZIP
        required: true
        type: string
      source_commit:
        description: Exact Runtime commit recorded by the selected run
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  context-menu:
    name: PWA context menu / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: aarch64
    steps:
      - name: Checkout maintained native integration tests
        uses: actions/checkout@v4
        with:
          repository: Floorp-Projects/Floorp
          ref: e1da5a98af5fa72065994514dc9618f2a38ba338
          path: floorp
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/app-shim/test-runtime.py
            tools/app-shim/test-context-menu.py

      - name: Authenticate and download the exact compiled artifact
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TARGET_ARCH: ${{ matrix.arch }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            for (const key of ['SOURCE_RUN_ID', 'ARTIFACT_ID']) {
              if (!/^[1-9][0-9]*$/.test(process.env[key] || '') ||
                  !Number.isSafeInteger(Number(process.env[key]))) {
                throw new Error(`Invalid ${key}`);
              }
            }
            if (!/^[0-9a-f]{40}$/.test(process.env.SOURCE_COMMIT || '') ||
                !/^sha256:[0-9a-f]{64}$/.test(process.env.ARTIFACT_DIGEST || '')) {
              throw new Error('Invalid immutable artifact contract');
            }
            const runId = Number(process.env.SOURCE_RUN_ID);
            const artifactId = Number(process.env.ARTIFACT_ID);
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            const {data: artifact} = await github.rest.actions.getArtifact({...context.repo, artifact_id: artifactId});
            if (run.status !== 'completed' || run.head_sha !== process.env.SOURCE_COMMIT ||
                run.repository.full_name !== 'Floorp-Projects/Floorp-Runtime' ||
                artifact.expired || artifact.name !== 'floorp-mac-universal-moz-artifact' ||
                artifact.digest !== process.env.ARTIFACT_DIGEST ||
                artifact.workflow_run.id !== runId || artifact.workflow_run.head_sha !== run.head_sha) {
              throw new Error('Runtime artifact identity mismatch');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
              {...context.repo, run_id: runId, per_page: 100});
            if (!jobs.some(job => job.conclusion === 'success' &&
                job.name.includes(`Verify Darwin/${process.env.TARGET_ARCH} final runtime`))) {
              throw new Error('Selected artifact has no successful native verifier for this architecture');
            }
            const response = await github.rest.actions.downloadArtifact(
              {...context.repo, artifact_id: artifactId, archive_format: 'zip'});
            const bytes = Buffer.from(response.data);
            const digest = 'sha256:' + crypto.createHash('sha256').update(bytes).digest('hex');
            if (digest !== artifact.digest) throw new Error('Downloaded ZIP digest mismatch');
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'runtime.zip'), bytes);
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'runtime-input.json'),
              JSON.stringify({runId, artifactId, digest, sourceCommit: run.head_sha,
                expectedBuildId: run.created_at.replace(/\D/g, '').slice(0, 14)}, null, 2));

      - name: Verify and run the native context-menu regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-artifact" "$RUNNER_TEMP/runtime-mount" "$RUNNER_TEMP/pwa-context-menu"
          unzip -q "$RUNNER_TEMP/runtime.zip" -d "$RUNNER_TEMP/runtime-artifact"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/runtime-mount" \
            "$RUNNER_TEMP/runtime-artifact/floorp-macOS-universal-moz-artifact.dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/runtime-mount" || true' EXIT
          ditto "$RUNNER_TEMP/runtime-mount/Floorp.app" "$RUNNER_TEMP/Floorp.app"
          cp "$RUNNER_TEMP/runtime-input.json" "$RUNNER_TEMP/pwa-context-menu/runtime-input.json"
          python3 - <<'PY'
          import configparser
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          expected = json.loads((root / 'runtime-input.json').read_text())['expectedBuildId']
          for filename, section in [('application.ini', 'App'), ('platform.ini', 'Build')]:
              config = configparser.ConfigParser(interpolation=None)
              config.read(root / 'Floorp.app/Contents/Resources' / filename)
              if config[section]['BuildID'] != expected:
                  raise ValueError('Packaged BuildID mismatch')
          PY
          # Raw Runtime artifacts are unsigned. Use the documented local
          # developer signature on this disposable copy to exercise the normal
          # authenticated host/shim handshake. This is not distribution signing.
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          app = root / 'Floorp.app'
          removed = []
          for path in [app, *app.rglob('*')]:
              if path.is_symlink():
                  continue
              attributes = subprocess.check_output(['/usr/bin/xattr', str(path)], text=True)
              for name in attributes.splitlines():
                  if name in {'com.apple.FinderInfo', 'com.apple.ResourceFork'}:
                      subprocess.run(['/usr/bin/xattr', '-d', name, str(path)], check=True)
                      removed.append({'path': str(path.relative_to(app)), 'attribute': name})
          (root / 'pwa-context-menu/development-copy-metadata.json').write_text(
              json.dumps({'removed': removed}, indent=2) + '\n')
          PY
          codesign --force --deep --sign - --timestamp=none "$RUNNER_TEMP/Floorp.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/Floorp.app"
          codesign --display --verbose=4 "$RUNNER_TEMP/Floorp.app" \
            > "$RUNNER_TEMP/pwa-context-menu/development-signature.txt" 2>&1
          python3 - <<'PY'
          import ctypes
          import json
          import os
          from pathlib import Path

          graphics = ctypes.CDLL('/System/Library/Frameworks/CoreGraphics.framework/CoreGraphics')
          graphics.CGPreflightPostEventAccess.restype = ctypes.c_bool
          graphics.CGPreflightScreenCaptureAccess.restype = ctypes.c_bool
          permissions = {
              'eventPosting': bool(graphics.CGPreflightPostEventAccess()),
              'screenCapture': bool(graphics.CGPreflightScreenCaptureAccess()),
              'permissionPromptOpened': False,
          }
          output = Path(os.environ['RUNNER_TEMP']) / 'pwa-context-menu/gui-permissions.json'
          output.write_text(json.dumps(permissions, indent=2) + '\n')
          print(output.read_text())
          PY
          python3 floorp/tools/app-shim/test-context-menu.py \
            --browser "$RUNNER_TEMP/Floorp.app" \
            --output "$RUNNER_TEMP/pwa-context-menu" --iterations 20

      - name: Verify native GUI input with existing macOS permissions
        shell: bash
        run: |
          set -euo pipefail
          python3 floorp/tools/app-shim/test-runtime.py \
            --browser "$RUNNER_TEMP/Floorp.app" \
            --output "$RUNNER_TEMP/pwa-context-menu/native-gui" \
            --launch-services --capture-window

      - name: Upload native regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-context-menu-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pwa-context-menu
          if-no-files-found: error
