# SPDX-License-Identifier: MPL-2.0

name: Validate native PWA context menus

"on":
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Runtime run with successful native macOS verification
        required: true
        type: string
      artifact_id:
        description: Exact macOS Universal Actions artifact ID
        required: true
        type: string
      artifact_digest:
        description: Exact SHA-256 of the Actions artifact ZIP
        required: true
        type: string
      source_commit:
        description: Exact Runtime commit recorded by the selected run
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  context-menu:
    name: PWA context menu / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: aarch64
    steps:
      - name: Checkout maintained native integration tests
        uses: actions/checkout@v4
        with:
          repository: Floorp-Projects/Floorp
          ref: e1da5a98af5fa72065994514dc9618f2a38ba338
          path: floorp
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/app-shim/test-runtime.py
            tools/app-shim/test-context-menu.py

      - name: Authenticate and download the exact compiled artifact
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TARGET_ARCH: ${{ matrix.arch }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            for (const key of ['SOURCE_RUN_ID', 'ARTIFACT_ID']) {
              if (!/^[1-9][0-9]*$/.test(process.env[key] || '') ||
                  !Number.isSafeInteger(Number(process.env[key]))) {
                throw new Error(`Invalid ${key}`);
              }
            }
            if (!/^[0-9a-f]{40}$/.test(process.env.SOURCE_COMMIT || '') ||
                !/^sha256:[0-9a-f]{64}$/.test(process.env.ARTIFACT_DIGEST || '')) {
              throw new Error('Invalid immutable artifact contract');
            }
            const runId = Number(process.env.SOURCE_RUN_ID);
            const artifactId = Number(process.env.ARTIFACT_ID);
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            const {data: artifact} = await github.rest.actions.getArtifact({...context.repo, artifact_id: artifactId});
            if (run.status !== 'completed' || run.head_sha !== process.env.SOURCE_COMMIT ||
                run.repository.full_name !== 'Floorp-Projects/Floorp-Runtime' ||
                artifact.expired || artifact.name !== 'floorp-mac-universal-moz-artifact' ||
                artifact.digest !== process.env.ARTIFACT_DIGEST ||
                artifact.workflow_run.id !== runId || artifact.workflow_run.head_sha !== run.head_sha) {
              throw new Error('Runtime artifact identity mismatch');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
              {...context.repo, run_id: runId, per_page: 100});
            if (!jobs.some(job => job.conclusion === 'success' &&
                job.name.includes(`Verify Darwin/${process.env.TARGET_ARCH} final runtime`))) {
              throw new Error('Selected artifact has no successful native verifier for this architecture');
            }
            const response = await github.rest.actions.downloadArtifact(
              {...context.repo, artifact_id: artifactId, archive_format: 'zip'});
            const bytes = Buffer.from(response.data);
            const digest = 'sha256:' + crypto.createHash('sha256').update(bytes).digest('hex');
            if (digest !== artifact.digest) throw new Error('Downloaded ZIP digest mismatch');
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'runtime.zip'), bytes);
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'runtime-input.json'),
              JSON.stringify({runId, artifactId, digest, sourceCommit: run.head_sha,
                expectedBuildId: run.created_at.replace(/\D/g, '').slice(0, 14)}, null, 2));

      - name: Verify and run the native context-menu regression
        id: context-menu
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-artifact" "$RUNNER_TEMP/runtime-mount" "$RUNNER_TEMP/pwa-context-menu"
          unzip -q "$RUNNER_TEMP/runtime.zip" -d "$RUNNER_TEMP/runtime-artifact"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/runtime-mount" \
            "$RUNNER_TEMP/runtime-artifact/floorp-macOS-universal-moz-artifact.dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/runtime-mount" || true' EXIT
          ditto "$RUNNER_TEMP/runtime-mount/Floorp.app" "$RUNNER_TEMP/Floorp.app"
          cp "$RUNNER_TEMP/runtime-input.json" "$RUNNER_TEMP/pwa-context-menu/runtime-input.json"
          python3 - <<'PY'
          import configparser
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          expected = json.loads((root / 'runtime-input.json').read_text())['expectedBuildId']
          for filename, section in [('application.ini', 'App'), ('platform.ini', 'Build')]:
              config = configparser.ConfigParser(interpolation=None)
              config.read(root / 'Floorp.app/Contents/Resources' / filename)
              if config[section]['BuildID'] != expected:
                  raise ValueError('Packaged BuildID mismatch')
          PY
          # Raw Runtime artifacts are unsigned. Use the documented local
          # developer signature on this disposable copy to exercise the normal
          # authenticated host/shim handshake. This is not distribution signing.
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          app = root / 'Floorp.app'
          removed = []
          for path in [app, *app.rglob('*')]:
              if path.is_symlink():
                  continue
              attributes = subprocess.check_output(['/usr/bin/xattr', str(path)], text=True)
              for name in attributes.splitlines():
                  if name in {'com.apple.FinderInfo', 'com.apple.ResourceFork'}:
                      subprocess.run(['/usr/bin/xattr', '-d', name, str(path)], check=True)
                      removed.append({'path': str(path.relative_to(app)), 'attribute': name})
          (root / 'pwa-context-menu/development-copy-metadata.json').write_text(
              json.dumps({'removed': removed}, indent=2) + '\n')
          PY
          codesign --force --deep --sign - --timestamp=none "$RUNNER_TEMP/Floorp.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/Floorp.app"
          codesign --display --verbose=4 "$RUNNER_TEMP/Floorp.app" \
            > "$RUNNER_TEMP/pwa-context-menu/development-signature.txt" 2>&1
          python3 - <<'PY'
          import ctypes
          import json
          import os
          from pathlib import Path

          graphics = ctypes.CDLL('/System/Library/Frameworks/CoreGraphics.framework/CoreGraphics')
          graphics.CGPreflightPostEventAccess.restype = ctypes.c_bool
          graphics.CGPreflightScreenCaptureAccess.restype = ctypes.c_bool
          permissions = {
              'eventPosting': bool(graphics.CGPreflightPostEventAccess()),
              'screenCapture': bool(graphics.CGPreflightScreenCaptureAccess()),
              'permissionPromptOpened': False,
          }
          output = Path(os.environ['RUNNER_TEMP']) / 'pwa-context-menu/gui-permissions.json'
          output.write_text(json.dumps(permissions, indent=2) + '\n')
          print(output.read_text())
          PY
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          import sys
          from pathlib import Path

          script = Path('floorp/tools/app-shim/test-context-menu.py').resolve()
          spec = importlib.util.spec_from_file_location('context_menu_test', script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          original_poll = module.h.HostProcess.poll

          def diagnostic_poll(host):
              result = original_poll(host)
              if result is not None and host.pid is None:
                  rows = [row for row in host._process_rows() if str(host.profile) in row[2]]
                  print(json.dumps({'launcherExitCode': host.process.returncode,
                                    'isolatedProfileProcesses': rows}), flush=True)
              return result

          module.h.HostProcess.poll = diagnostic_poll
          root = Path(os.environ['RUNNER_TEMP'])
          sys.argv = [str(script), '--browser', str(root / 'Floorp.app'),
                      '--output', str(root / 'pwa-context-menu'), '--iterations', '20']
          raise SystemExit(module.main())
          PY

      - name: Verify native GUI input with existing macOS permissions
        shell: bash
        run: |
          set -euo pipefail
          python3 floorp/tools/app-shim/test-runtime.py \
            --browser "$RUNNER_TEMP/Floorp.app" \
            --output "$RUNNER_TEMP/pwa-context-menu/native-gui" \
            --launch-services --capture-window

      - name: Diagnose subprocess startup after a failed LaunchServices probe
        id: subprocess-diagnostic
        if: ${{ failure() && steps.context-menu.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          # This supported launch mode keeps the child PID and its real exit
          # status. Its report cannot replace the failed LaunchServices gate.
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          import shutil
          import sys
          import time
          from pathlib import Path

          script = Path('floorp/tools/app-shim/test-runtime.py').resolve()
          spec = importlib.util.spec_from_file_location('native_runtime_test', script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          root = Path(os.environ['RUNNER_TEMP'])
          output = root / 'pwa-context-menu/subprocess-diagnostic'
          output.mkdir(parents=True, exist_ok=True)
          identities = []
          original_init = module.HostProcess.__init__

          def record_host(host, *args, **kwargs):
              original_init(host, *args, **kwargs)
              identities.append({'pid': host.process.pid, 'command': host.command})

          module.HostProcess.__init__ = record_host
          sys.argv = [str(script), '--browser', str(root / 'Floorp.app'),
                      '--output', str(output), '--capture-window']
          code = module.main()
          (output / 'launcher-identities.json').write_text(
              json.dumps(identities, indent=2) + '\n')
          # Retain only OS crash reports for our exact freshly launched child.
          # This does not change crash handling or the original test result.
          reports = Path.home() / 'Library/Logs/DiagnosticReports'
          process_names = {'Floorp', *(Path(item['command'][0]).name
                                      for item in identities)}
          captured = []
          deadline = time.monotonic() + 15
          while time.monotonic() < deadline and not captured:
              candidates = {path for name in process_names
                            for path in reports.glob(f'{name}*.ips')}
              for path in sorted(candidates):
                  if path.stat().st_size > 10 * 1024 * 1024:
                      continue
                  try:
                      crash = json.loads(path.read_text().split('\n', 1)[1])
                  except (ValueError, IndexError):
                      continue
                  if not any(crash.get('pid') == item['pid'] and
                             crash.get('procPath') == item['command'][0]
                             for item in identities):
                      continue
                  destination = output / 'DiagnosticReports'
                  destination.mkdir(exist_ok=True)
                  shutil.copyfile(path, destination / path.name)
                  captured.append(path.name)
              if not captured:
                  time.sleep(0.5)
          print(json.dumps({'ownedHostIdentities': identities,
                            'matchingCrashReports': captured}), flush=True)
          raise SystemExit(code)
          PY

      - name: Inspect startup crash with existing Xcode debugger access
        if: ${{ failure() && steps.subprocess-diagnostic.outcome == 'failure' }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          output = Path(os.environ['RUNNER_TEMP']) / 'pwa-context-menu'
          mode = subprocess.run(['/usr/sbin/DevToolsSecurity', '-status'],
                                capture_output=True, text=True, check=True)
          groups = subprocess.check_output(['/usr/bin/id', '-Gn'], text=True).split()
          available = 'currently enabled' in mode.stdout and any(
              group in groups for group in ('admin', '_developer'))
          (output / 'debugger-access.json').write_text(json.dumps({
              'developerMode': mode.stdout.strip(), 'groups': groups,
              'existingAccess': available, 'permissionChangeRequested': False,
          }, indent=2) + '\n')
          if not available:
              raise SystemExit('Existing debugger access unavailable; no permission change attempted')
          PY
          cat > "$RUNNER_TEMP/pwa-context-menu/lldb-startup.py" <<'PY'
          import json
          import os
          import shutil
          import time
          import traceback
          from pathlib import Path

          import lldb

          root = Path(os.environ['RUNNER_TEMP']) / 'pwa-context-menu'
          source = root / 'subprocess-diagnostic'
          identity = json.loads((source / 'launcher-identities.json').read_text())[0]
          command = identity['command'][:]
          profile = root / 'lldb-profile'
          profile.mkdir(mode=0o700)
          shutil.copyfile(Path(command[command.index('--profile') + 1]) / 'user.js',
                          profile / 'user.js')
          command[command.index('--profile') + 1] = str(profile)
          debugger = lldb.SBDebugger.Create()
          debugger.SetAsync(True)
          target = debugger.CreateTarget(command[0])
          launch = lldb.SBLaunchInfo(command[1:])
          launch.SetLaunchFlags(launch.GetLaunchFlags() & ~lldb.eLaunchFlagDisableASLR)
          launch.SetEnvironmentEntries(['MOZ_CRASHREPORTER_DISABLE=1'], True)
          launch.SetWorkingDirectory(str(root))
          error = lldb.SBError()
          process = target.Launch(launch, error)
          report = {'diagnosticOnly': True, 'command': command,
                    'launchError': error.GetCString(), 'pid': process.GetProcessID()}
          try:
              if error.Fail():
                  print(json.dumps(report), flush=True)
                  raise RuntimeError('Debugger launch failed; existing permissions were not changed')
              deadline = time.monotonic() + 45
              active = {lldb.eStateAttaching, lldb.eStateConnected,
                        lldb.eStateLaunching, lldb.eStateRunning, lldb.eStateStepping}
              while process.GetState() in active and time.monotonic() < deadline:
                  time.sleep(0.1)
              report['state'] = int(process.GetState())
              report['exitStatus'] = process.GetExitStatus()
              with (root / 'lldb-backtrace.log').open('w') as trace:
                  for query in ('process status', 'thread backtrace all', 'image list'):
                      result = lldb.SBCommandReturnObject()
                      debugger.GetCommandInterpreter().HandleCommand(query, result)
                      trace.write(f'{query}\n')
                      trace.write(result.GetOutput() or result.GetError() or '')
                      trace.write('\n')
          except Exception:
              report['error'] = traceback.format_exc()
              (root / 'lldb-error.log').write_text(report['error'])
          finally:
              # LLDB owns this newly launched private-profile child. Only that
              # debugger process is retired; no application-name kill is used.
              if process.IsValid() and process.GetState() not in {
                      lldb.eStateExited, lldb.eStateDetached, lldb.eStateUnloaded}:
                  report['cleanupError'] = process.Kill().GetCString()
              (root / 'lldb-startup.json').write_text(json.dumps(report, indent=2) + '\n')
              lldb.SBDebugger.Destroy(debugger)
          PY
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'pwa-context-menu'
          script = str(root / 'lldb-startup.py')
          literal = json.dumps(script)
          command = f'script exec(compile(open({literal}).read(), {literal}, "exec"))'
          with (root / 'lldb-startup.log').open('w') as output:
              result = subprocess.run(['xcrun', 'lldb', '--batch', '--no-lldbinit',
                                       '--one-line', command], stdout=output,
                                      stderr=subprocess.STDOUT, check=False)
          print((root / 'lldb-startup.log').read_text())
          report = json.loads((root / 'lldb-startup.json').read_text())
          print(json.dumps(report, indent=2))
          trace = root / 'lldb-backtrace.log'
          if trace.is_file():
              print(trace.read_text())
          raise SystemExit(result.returncode or int(
              bool(report.get('error')) or 'state' not in report or not trace.is_file()))
          PY

      - name: Upload native regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-context-menu-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pwa-context-menu
          if-no-files-found: error
