---
# SPDX-License-Identifier: MPL-2.0

name: QA314 one-shot macOS Debug diagnosis

'on':
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: qa314-macos-debug-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/qa314-macos-debug-diagnostic' &&
      github.run_attempt == 1
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout isolated diagnostic scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/scripts/qa314_mac_diagnostic.py
            .github/workflows/scripts/qa314_lldb_capture.py
            .github/runtime-upstream.json

      - name: Checkout unchanged native test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Floorp-Projects/Floorp
          ref: e1da5a98af5fa72065994514dc9618f2a38ba338
          path: floorp-native-tests
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: tools/app-shim/test-runtime.py

      - name: Match existing test Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Validate provenance and download original ZIP once
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          QA314_EVIDENCE: ${{ runner.temp }}/qa314-mac-evidence
          QA314_WORK: ${{ runner.temp }}/qa314-mac-work
        with:
          retries: 0
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            if (`${repo.owner}/${repo.repo}` !== 'Floorp-Projects/Floorp-Runtime') {
              throw new Error('Wrong repository');
            }
            const history = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...repo, workflow_id: 'verify-runtime-artifact.yml',
              branch: 'codex/qa314-macos-debug-diagnostic',
              event: 'workflow_dispatch', per_page: 100,
            });
            if (history.some(run => run.id !== context.runId)) {
              throw new Error('A diagnostic run already exists; refusing another execution');
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...repo, run_id: 37999082434,
            });
            if (run.head_sha !== 'c74fe1a545d275cdd710ab44701c1ee0dd6b0eae' ||
                run.head_branch !== 'nora-0.2.0' || run.run_attempt !== 1 ||
                run.created_at !== '2026-10-09T22:24:56Z' ||
                run.status !== 'completed' || run.conclusion !== 'failure') {
              throw new Error('Source run differs from the authorized failed attempt');
            }
            const {data: artifact} = await github.rest.actions.getArtifact({
              ...repo, artifact_id: 11654576822,
            });
            const digest = '644b13fdebb7f357b98efff5208bb0fe1d03d95686d9e887f08f483ffb1ee42e';
            if (artifact.id !== 11654576822 || artifact.expired ||
                artifact.name !== 'floorp-mac-universal-moz-artifact' ||
                artifact.size_in_bytes !== 237865129 ||
                artifact.digest !== `sha256:${digest}` ||
                artifact.workflow_run?.id !== run.id ||
                artifact.workflow_run?.head_sha !== run.head_sha) {
              throw new Error('Original artifact metadata mismatch');
            }
            fs.mkdirSync(process.env.QA314_EVIDENCE, {recursive: true, mode: 0o700});
            fs.mkdirSync(process.env.QA314_WORK, {recursive: true, mode: 0o700});
            const provenance = {
              sourceRun: Object.fromEntries(['id', 'head_sha', 'head_branch',
                'run_attempt', 'created_at', 'status', 'conclusion'].map(k => [k, run[k]])),
              artifact: Object.fromEntries(['id', 'name', 'size_in_bytes',
                'digest', 'expired', 'workflow_run'].map(k => [k, artifact[k]])),
              diagnostic: {runId: context.runId, attempt: 1, head: context.sha,
                ref: context.ref, runner: 'macos-14', arch: 'arm64',
                buildVariant: 'debug/non-PGO', verifierDebugInputInOriginalRun: false},
            };
            fs.writeFileSync(path.join(process.env.QA314_EVIDENCE, 'provenance.json'),
              JSON.stringify(provenance, null, 2) + '\n');
            const archive = await github.rest.actions.downloadArtifact({
              ...repo, artifact_id: artifact.id, archive_format: 'zip',
            });
            const bytes = Buffer.from(archive.data);
            const actual = crypto.createHash('sha256').update(bytes).digest('hex');
            if (bytes.length !== artifact.size_in_bytes || actual !== digest) {
              throw new Error('Downloaded original ZIP differs from the fixed digest or size');
            }
            fs.writeFileSync(path.join(process.env.QA314_WORK, 'original-artifact.zip'),
              bytes, {flag: 'wx', mode: 0o400});
            fs.writeFileSync(path.join(process.env.QA314_EVIDENCE, 'download.json'),
              JSON.stringify({bytes: bytes.length, sha256: actual, downloads: 1}, null, 2) + '\n');

      - name: Prepare disposable copy without launching a browser
        shell: bash
        env:
          QA314_EVIDENCE: ${{ runner.temp }}/qa314-mac-evidence
          QA314_WORK: ${{ runner.temp }}/qa314-mac-work
        run: >-
          python3 .github/workflows/scripts/qa314_mac_diagnostic.py prepare

      - name: Run fixed native-input test exactly once under bounded diagnosis
        shell: bash
        timeout-minutes: 8
        env:
          QA314_EVIDENCE: ${{ runner.temp }}/qa314-mac-evidence
          QA314_WORK: ${{ runner.temp }}/qa314-mac-work
        run: >-
          python3 .github/workflows/scripts/qa314_mac_diagnostic.py run

      - name: Collect test-owned logs and crash reports
        if: always()
        shell: bash
        timeout-minutes: 2
        env:
          QA314_EVIDENCE: ${{ runner.temp }}/qa314-mac-evidence
          QA314_WORK: ${{ runner.temp }}/qa314-mac-work
        run: >-
          python3 .github/workflows/scripts/qa314_mac_diagnostic.py collect

      - name: Preserve diagnostic evidence from this attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa314-mac-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa314-mac-evidence
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14
