jobs:
  diagnostic:
    name: helper-timing
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Admit one initial public branch push
        timeout-minutes: 1
        shell: bash
        env:
          FRESH_PUSH_CREATED: ${{ github.event.created }}
          FRESH_PUSH_DELETED: ${{ github.event.deleted }}
          FRESH_PUSH_BEFORE: ${{ github.event.before }}
          EVENT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REPOSITORY" == Floorp-Projects/Floorp-Runtime ]]
          [[ "$GITHUB_EVENT_NAME" == push ]]
          [[ "$GITHUB_REF" == refs/heads/codex/mac-native-helper-timing-recovery68 ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$FRESH_PUSH_CREATED" == true && "$FRESH_PUSH_DELETED" == false ]]
          [[ "$FRESH_PUSH_BEFORE" == 0000000000000000000000000000000000000000 ]]
          [[ "$EVENT_REPOSITORY_PRIVATE" == false ]]
          [[ "$FLOORP_FIXTURE_SHA" =~ ^[0-9a-f]{40}$ ]]
          TASK_PYTHON="$RUNNER_TOOL_CACHE/Python/3.12.10/x64/bin/python3"
          [[ -x "$TASK_PYTHON" ]]
          echo "TASK_PYTHON=$TASK_PYTHON" >> "$GITHUB_ENV"
          echo "TASK_ROOT=$RUNNER_TEMP/floorp-helper-timing" >> "$GITHUB_ENV"

      - name: Checkout immutable reviewed QA fixture
        timeout-minutes: 3
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Floorp-Projects/Floorp
          ref: ${{ env.FLOORP_FIXTURE_SHA }}
          path: fixture
          persist-credentials: false
          fetch-depth: 1

      - name: Measure idle and bounded contention
        id: diagnostic
        timeout-minutes: 18
        shell: bash
        env:
          JOB_READ_TOKEN: ${{ github.token }}
          FRESH_PUSH_CREATED: ${{ github.event.created }}
          FRESH_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          umask 077
          "$TASK_PYTHON" fixture/tools/qa/native-nonpgo/helper_timing_caller.py --execute --task "$TASK_ROOT" > "$RUNNER_TEMP/helper-timing-execute.private.log" 2>&1

      - name: Verify terminal evidence and emit bounded summary
        if: ${{ always() }}
        timeout-minutes: 3
        shell: bash
        env:
          DIAGNOSTIC_STEP_OUTCOME: ${{ steps.diagnostic.outcome }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${TASK_PYTHON:-}" || -z "${TASK_ROOT:-}" || ! -f fixture/tools/qa/native-nonpgo/helper_timing_caller.py ]]; then
            echo '{"helperTiming":{"status":"failed","terminalJobSuccessRequired":true,"stdoutAloneQualifies":false}}'
            exit 1
          fi
          "$TASK_PYTHON" fixture/tools/qa/native-nonpgo/helper_timing_caller.py --finalize --task "$TASK_ROOT"
