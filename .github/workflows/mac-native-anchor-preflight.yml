                  from primary_anchor import retained_anchors
                  phase='original-clock'
                  plan=json.loads((helper/'plan.json').read_text())
                  require(type(plan['limits']['jobMinutes']) is int and plan['limits']['jobMinutes']==360,'anchor-preflight-platform')
                  runner=Runner(task,float((task/'started').read_text()),plan['limits'])
                  original=runner.monotonic_started
                  def work_bound():
                      require(runner.monotonic_started==original and 0<=time.monotonic()-original<345*60,
                              'anchor-preflight-work-deadline')
                  work_bound()
                  require(sys.platform=='darwin' and list(sys.version_info[:3])==[3,12,10],'anchor-preflight-interpreter')
                  env=clean_environment(task)
                  tmp=task/'tmp';tmp.mkdir(mode=0o700,exist_ok=False)
                  env.update({'TMPDIR':str(tmp),'PYTHONDONTWRITEBYTECODE':'1','PYTHONWARNINGS':'error::ResourceWarning'})
                  env.update({key:os.environ[key] for key in (*BINDING_KEYS,'TASK_ROOT')})
                  phase='self-probe'
                  from darwin_activity import probe
                  own=probe().read(os.getpid(),os.getpgrp())
                  require(own.get('status')=='measured' and number(own.get('rssMiB')) and own['rssMiB']>0 and
                          number(own.get('cpuSeconds')) and own.get('state') in ('R','S','T'),'anchor-preflight-self')
                  result['self']={key:own[key] for key in ('status','rssMiB','cpuSeconds','state')}
                  phase='abi';work_bound()
                  abi=prepare_abi(task,runner,env)
                  os.environ['FLOORP_CENSUS_ABI']=str(abi);env['FLOORP_CENSUS_ABI']=str(abi)
                  load_abi(abi);work_bound()
                  require(len(runner.records)==2 and [row['stage'] for row in runner.records]==list(STAGES[:2]) and
                          all(stage_complete(row) for row in runner.records),'anchor-preflight-abi-completion')
                  phase='selected-tests';stage_error=None
                  try:
                      code='EXPECTED='+repr(EXPECTED)+'\nSELECTION_SHA='+repr(SELECTION_SHA)+'\nSOURCE_PINS='+repr(pins)+'\n'+CHILD
                      runner.run(STAGES[2],[sys.executable,'-c',code],helper,env,360,phase_deadline_minutes=345)
                  except BaseException as error:stage_error=error
                  phase='test-evidence'
                  try:
                      value,checksum=read_json(task/'anchor-selected-tests.json')
                      result['tests']=test_receipt(value,pins,source_lines);result['testReceiptSHA256']=checksum
                  except BaseException:
                      if stage_error is None:raise
                  try:
                      work_bound()
                      result['groupFixtureObservations']=group_markers(task/'anchor-selected-tests.private.log')
                  except BaseException as error:
                      result['groupFixtureEvidenceFailure']=fixed_error(error,'test-evidence','anchor-preflight-group-evidence-unavailable')
                      if stage_error is None:raise
                  if stage_error is not None:
                      phase='selected-tests';raise stage_error
                  require(result['tests'] is not None and result['tests']['status']=='passed','anchor-preflight-tests')
                  require(result['tests']['failureEvidenceValid'] is True and
                          result['tests']['failureEvidence']['status']=='observed','anchor-preflight-failure-evidence-unavailable')
                  require(result['groupFixtureObservations']['complete'] is True,'anchor-preflight-group-evidence-incomplete')
                  require(result['groupFixtureObservations']['unexpectedUnraisableMarkers']==0,'anchor-preflight-child-unraisable')
                  phase='final-proof';work_bound()
                  require(len(runner.records)==3 and [row['stage'] for row in runner.records]==list(STAGES) and
                          all(stage_complete(row) for row in runner.records) and runner.failure is None and
                          runner.monitor_failure is None and not runner.groups and not retained_anchors(),
                          'anchor-preflight-final-proof')
                  result['status']='passed';result['qualification']['actualMacPreflight']='passed'
              except BaseException as error:
                  primary=error;result['callerFailure']=fixed_error(error,phase,'anchor-preflight-operation-failed')
              finally:
                  def project_runner():
                      try:
                          def known_stage(value,raw):
                              if type(raw) is dict and raw.get('stage') in STAGES:value['stage']=raw['stage']
                              return value
                          result['stages']=[known_stage(stage_projection(row),row) for row in runner.records]
                          for value,row in zip(result['stages'],runner.records):
                              value['completionVerified']=stage_complete(row)
                              if 'cleanupFailure' not in row:value['cleanupFailurePresent']=None
                          result['allStagesComplete']=(len(runner.records)==3 and
                              [row['stage'] for row in runner.records]==list(STAGES) and all(stage_complete(row) for row in runner.records))
                          first=runner_failure(runner.failure)
                          result['runnerFirstFailure']=known_stage(first,runner.failure) if first is not None else None
                          result['monitorFailure']=monitor_projection(runner.monitor_failure) if runner.monitor_failure is not None else None
                          result['monitorDiagnostics']=[known_stage(monitor_projection(row),row) for row in runner.monitor_diagnostics[-16:]]
                          result['ownedGroupsEmpty']=not runner.groups if type(runner.groups) is set else None
                          result['unresolvedAnchors']=len(retained_anchors())
                          elapsed=time.monotonic()-original
                          if not number(elapsed):raise ValueError()
                          result['clock'].update(elapsedSeconds=elapsed,withinWorkBudget=elapsed<345*60)
                          if not (result['allStagesComplete'] and result['runnerFirstFailure'] is None and
                                  result['monitorFailure'] is None and result['ownedGroupsEmpty'] is True and
                                  result['unresolvedAnchors']==0 and result['clock']['withinWorkBudget'] is True):
                              result['status']='failed';result['qualification']['actualMacPreflight']='unconfirmed'
                      except BaseException as error:
                          result['status']='failed';result['qualification']['actualMacPreflight']='unconfirmed'
                          result['projectionFailure']=fixed_error(error,'public-evidence','anchor-preflight-projection-unavailable')
                  if runner is not None:project_runner()
                  if primary is not None:
                      result['status']='failed';result['qualification']['actualMacPreflight']='unconfirmed'
                  phase='public-evidence'
                  try:
                      if runner is None:raise ValueError()
                      write_json(task/'anchor-preflight.public.json',result)
                      persisted,_checksum=read_json(task/'anchor-preflight.public.json')
                      canonical=lambda value:json.dumps(value,sort_keys=True,separators=(',',':'))
                      if canonical(persisted)!=canonical(result):raise ValueError()
                      final_elapsed=time.monotonic()-original
                      terminal=(len(runner.records)==3 and [row['stage'] for row in runner.records]==list(STAGES) and
                          all(stage_complete(row) for row in runner.records) and runner.failure is None and
                          runner.monitor_failure is None and not runner.groups and not retained_anchors())
                      if not (terminal and runner.monotonic_started==original and number(final_elapsed) and final_elapsed<345*60):
                          result['status']='failed';result['qualification']['actualMacPreflight']='unconfirmed'
                          project_runner()
                          result['clock'].update(elapsedSeconds=final_elapsed if number(final_elapsed) else None,
                              withinWorkBudget=(final_elapsed<345*60 if number(final_elapsed) and runner.monotonic_started==original else None))
                          if result['callerFailure'] is None:
                              result['callerFailure']={'phase':'public-evidence','code':'anchor-preflight-final-state-changed',
                                                      'errorType':'operation-error','errno':None}
                          write_json(task/'anchor-preflight.public.json',result)
                  except BaseException as error:
                      result['status']='failed';result['qualification']['actualMacPreflight']='unconfirmed'
                      result['evidenceWriteFailure']=fixed_error(error,phase,'anchor-preflight-evidence-write-failed')
                  print(json.dumps({'anchorPreflight':result},sort_keys=True,separators=(',',':')),flush=True)
              return 0 if result['status']=='passed' else 1
          try:raise SystemExit(main())
          except SystemExit:raise
          except BaseException:
              print(json.dumps({'anchorPreflightUnavailable':{'status':'failed','code':'anchor-preflight-driver-unavailable'}}),flush=True)
              raise SystemExit(1)
          PYCODE
