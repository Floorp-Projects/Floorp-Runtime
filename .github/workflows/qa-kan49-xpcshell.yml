name: KAN49 native shutdown timer xpcshell

on:
  push:
    branches: [qa/kan49-native-timer-shutdown]

permissions:
  contents: read
  actions: read

concurrency:
  group: kan49-native-timer-de03dfa
  cancel-in-progress: false

jobs:
  context:
    if: github.event.created && github.run_attempt == 1
    uses: ./.github/workflows/resolve-build-context.yml
    with:
      require_run_metadata: true
  native:
    needs: context
    uses: ./.github/workflows/common-build.yml
    with:
      platform: linux
      arch: x86_64
      debug: true
      pgo: false
      release: false
      MOZ_BUILD_DATE: ${{ needs.context.outputs.expected-build-id }}
