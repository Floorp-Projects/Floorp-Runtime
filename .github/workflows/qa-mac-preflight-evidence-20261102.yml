        test "$GITHUB_REF" = refs/heads/b/qa-handoff-20261026

        test "$GITHUB_EVENT_NAME" = push

        test "$GITHUB_RUN_ATTEMPT" = 1

        test "$PUSH_CREATED" = false

        test "$PUSH_BEFORE" = 4b365e79305ccb7a373bee3d372b21fd99be45fc

        TASK_PYTHON="$RUNNER_TOOL_CACHE/Python/3.12.10/x64/bin/python3"

        test -x "$TASK_PYTHON"

        test -x /usr/local/opt/openssl@3/bin/openssl

        echo "TASK_PYTHON=$TASK_PYTHON" >> "$GITHUB_ENV"

        echo "TASK_ROOT=$RUNNER_TEMP/floorp-preflight-evidence-20261102" >> "$GITHUB_ENV"

        '
    - name: Checkout the immutable diagnostic source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        path: diagnostic
        fetch-depth: 2
        persist-credentials: false
    - name: Checkout the unchanged failed fixture
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: Floorp-Projects/Floorp
        ref: ${{ env.FLOORP_FIXTURE_SHA }}
        path: fixture
        persist-credentials: false
        fetch-depth: 1
    - name: Verify all immutable diagnostic inputs
      shell: bash
      run: "set -euo pipefail\ntest \"$(git -C diagnostic rev-parse HEAD)\" = \"$GITHUB_SHA\"\ntest \"$(git -C diagnostic\
        \ rev-parse HEAD^)\" = \"$PUSH_BEFORE\"\ntest \"$(git -C fixture rev-parse HEAD)\" = \"$FLOORP_FIXTURE_SHA\"\n\"$TASK_PYTHON\"\
        \ - <<'PINS'\nimport hashlib,json,os,pathlib\nroot=pathlib.Path(os.environ['GITHUB_WORKSPACE'])\nscript=root/'diagnostic/.github/scripts/qa_preflight_evidence_20261102.py'\n\
        assert not script.is_symlink() and hashlib.sha256(script.read_bytes()).hexdigest()==os.environ['PREFLIGHT_SCRIPT_SHA256']\n\
        helper=root/'fixture/tools/qa/native-nonpgo'\npins=json.loads(os.environ['QA_SOURCE_PINS'])\nassert len(pins)==157\n\
        for name,checksum in pins.items():\n    path=helper/name\n    assert not path.is_symlink() and hashlib.sha256(path.read_bytes()).hexdigest()==checksum\n\
        PINS\n"
    - name: Anchor the diagnostic clock to this API job
      id: origin
      timeout-minutes: 2
      env:
        JOB_READ_TOKEN: ${{ github.token }}
      shell: bash
      run: '"$TASK_PYTHON" diagnostic/.github/scripts/qa_preflight_evidence_20261102.py origin --task "$TASK_ROOT" --helper
        "$GITHUB_WORKSPACE/fixture/tools/qa/native-nonpgo"

        '
    - name: Run the unchanged 824-case preflight and 14 recording controls
      id: preflight
      timeout-minutes: 10
      shell: bash
      run: '"$TASK_PYTHON" diagnostic/.github/scripts/qa_preflight_evidence_20261102.py run --task "$TASK_ROOT" --helper "$GITHUB_WORKSPACE/fixture/tools/qa/native-nonpgo"
        > "$TASK_ROOT/monitor-preflight-driver.private.log" 2>&1

        '
    - name: Encrypt fixed preflight logs after success or failure
      id: encrypt
      if: always() && steps.origin.outcome == 'success'
      timeout-minutes: 2
      shell: bash
      run: '"$TASK_PYTHON" diagnostic/.github/scripts/qa_preflight_evidence_20261102.py encrypt --task "$TASK_ROOT" --helper
        "$GITHUB_WORKSPACE/fixture/tools/qa/native-nonpgo" --openssl /usr/local/opt/openssl@3/bin/openssl --output "$RUNNER_TEMP/preflight-evidence-${{
        github.run_id }}-1.cms" > "$RUNNER_TEMP/preflight-evidence-${{ github.run_id }}-1.json"

        '
    - name: Retain only the encrypted logs and fixed metadata
      if: always() && steps.encrypt.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: preflight-evidence-${{ github.run_id }}-1
        path: '${{ runner.temp }}/preflight-evidence-${{ github.run_id }}-1.cms

          ${{ runner.temp }}/preflight-evidence-${{ github.run_id }}-1.json'
        if-no-files-found: error
        retention-days: 14
        overwrite: false
